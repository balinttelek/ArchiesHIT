<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golden Mean</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golden Mean">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#0f1115;--card:#181b21;--card2:#22262e;--line:#2a2f39;--text:#f2f3f5;--muted:#9aa0aa;--accent:#ff7a1a;--accent-ink:#1a0d02;--good:#3ecf8e;--warn:#ffb020;--bad:#ff5a5f;--r:16px}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--card:#ffffff;--card2:#eef0f3;--line:#e2e4e9;--text:#14161a;--muted:#646b76;--accent:#e8650a;--accent-ink:#ffffff;--good:#14a46b;--warn:#b87400;--bad:#d9363e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:30px;margin:10px 0 2px;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:15px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.alert{border-color:var(--warn)}
.notice{background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;font-size:15px}
.notice b{color:var(--warn)}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:6px}
.big{font-size:40px;font-weight:750;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.mid{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.grid3 button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1px solid transparent}
.grid3 button b{font-size:24px;font-variant-numeric:tabular-nums}.grid3 button span{font-size:11.5px;color:var(--muted);font-weight:600}
.grid3 button.on{border-color:var(--accent)}
.act{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .t{font-variant-numeric:tabular-nums;font-size:22px;font-weight:750;min-width:84px;text-align:right}
.runbar{position:sticky;top:0;z-index:30;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-weight:650}
.runbar .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runbar button{background:rgba(0,0,0,.18);color:inherit;min-height:34px;padding:4px 12px;font-size:14px}
.play{width:56px;min-width:56px;height:56px;border-radius:50%;padding:0;font-size:22px}
.play.on{background:var(--bad);color:#fff}
.bpm{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.beats{display:flex;justify-content:center;gap:10px;margin:14px 0}
.beats i{width:16px;height:16px;border-radius:50%;background:var(--card2);transition:background .05s}
.beats i.on{background:var(--accent)}.beats i.acc.on{background:var(--warn)}
.back{background:transparent;color:var(--accent);padding:0;min-height:32px;font-size:16px}
.task{border-top:1px solid var(--line);padding:4px 0}
.task:first-child{border-top:0}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;-webkit-user-select:none;user-select:none}
.tick{width:28px;min-width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:transparent}
.done .tick{background:var(--good);border-color:var(--good);color:#04130c}
.done>.trow .ttl,.sub.done .ttl{text-decoration:line-through;color:var(--muted)}
.ttl{font-weight:600;overflow-wrap:anywhere}
.subs{padding-left:38px}
.sub .trow{padding:6px 0}.sub .tick{width:22px;min-width:22px;height:22px;font-size:13px}
.carry{font-size:11px;font-weight:700;color:var(--warn)}
.ibtn{background:transparent;color:var(--muted);min-height:34px;min-width:34px;padding:0 6px;font-size:18px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav button{min-width:44px}
.trophy{display:block;padding:10px 0;border-top:1px solid var(--line)}
.trophy:first-child{border-top:0}
.cup{width:40px;min-width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cup svg{width:22px;height:22px;fill:none;stroke:#1a1200;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trophy.goal .cup{background:var(--card2)!important;border:2px dashed var(--line)}.trophy.goal .cup svg{stroke:var(--muted)}
.trophy.goal .tname{color:var(--muted)}
.trophy.goal .cup.gold{border-color:#d4a017}.trophy.goal .cup.silver{border-color:#9aa3ad}.trophy.goal .cup.bronze{border-color:#a0522d}
.trophy .trow2{display:flex;align-items:center;gap:12px;cursor:pointer;width:100%}
.tbody{padding:10px 0 4px 52px;display:grid;gap:8px}
.tbody audio,.tbody video{width:100%;border-radius:10px;background:#000}
.media{display:grid;gap:4px}
.rec{background:var(--bad)!important;color:#fff!important}
.cup.gold{background:linear-gradient(145deg,#ffe27a,#d4a017)}.cup.silver{background:linear-gradient(145deg,#f1f3f5,#9aa3ad)}.cup.bronze{background:linear-gradient(145deg,#f0b27a,#a0522d)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.chip{background:var(--card2);border-radius:10px;padding:8px 2px;text-align:center}
.chip b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.chip span{font-size:10.5px;color:var(--muted)}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar i.good{background:var(--good)}.bar i.over{background:var(--bad)}.bar i.warn{background:var(--warn)}
.c-good{color:var(--good)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-acc{color:var(--accent)}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--card2);color:var(--text);font-weight:600;cursor:pointer;min-height:44px}
button:active{opacity:.75}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border:1px solid var(--line)}
button.danger{color:var(--bad)}
button.sm{min-height:36px;padding:6px 12px;font-size:14px}
button.block{width:100%}
input,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:44px;-webkit-appearance:none;appearance:none}
input[type=range]{padding:0;border:0;background:transparent;min-height:32px;-webkit-appearance:auto;appearance:auto;accent-color:var(--accent)}
input::placeholder{color:var(--muted);opacity:.8}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.field{margin-bottom:12px}.field>span{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;min-height:40px;padding:6px 4px;font-size:15px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.mini button{min-height:32px;font-size:13px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.x{background:transparent;color:var(--muted);min-height:36px;padding:4px 10px;font-size:20px;line-height:1}
.foodform{display:grid;grid-template-columns:1fr 76px 96px;gap:8px}
.foodform button{grid-column:1/-1}
.inline{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:40}
nav .in{display:flex;gap:0;max-width:560px;width:100%}
nav button{flex:1;min-width:0;background:transparent;color:var(--muted);font-size:9.5px;letter-spacing:-.1px;padding:4px 0;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);margin-left:4px;vertical-align:2px;white-space:nowrap}
.tag.post{color:var(--warn)}.tag.added{color:var(--accent)}.tag.pre{color:var(--good)}
.ex{padding:14px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .name{font-weight:650}
.ex .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ex .reco{font-size:14px;margin-top:6px}
.ex .inputs{display:grid;grid-template-columns:1fr 1fr 52px;gap:8px;margin-top:8px}
.ex .extra{display:grid;grid-template-columns:130px 1fr;gap:8px;margin-top:8px}
.check{min-height:44px;padding:0;font-size:22px}
.check.on{background:var(--good);color:#04130c}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom))}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 10px}
.rate button{display:flex;flex-direction:column;align-items:center;padding:12px 2px;font-size:24px;font-weight:750}
.rate button small{font-size:11px;color:var(--muted);font-weight:500;margin-top:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.due{color:var(--good)}
.toggle.on{background:var(--good);color:#04130c}
.toggle.fast.on{background:var(--warn);color:#1a1200}
ol.howto{padding-left:20px;margin:6px 0 0}ol.howto li{margin:7px 0}
code{background:var(--card2);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden><div class="in">
<button data-a="tab" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Ma</button>
<button data-a="tab" data-v="workout"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Edzés</button>
<button data-a="tab" data-v="work"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>Munka</button>
<button data-a="tab" data-v="acts"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>Tevékenység</button>
<button data-a="tab" data-v="results"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Rekordok</button>
<button data-a="tab" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profil</button>
</div></nav>
<script>
"use strict";
const KEY='archiesHit_v1';
const MIN_REST=48,MAX_REST=168,KCAL_FLOOR=1600,MAX_STEPS=22000,GAIN_EXTRA=150,CAL_EXTRA_H=72,GRACE_DAYS=7,MAX_BMR_ADJ=500;
const LABELS=['Kimerült','Fáradt','Rendben','Jól','Kiváló'];
const GOALS={cut:{n:'Fogyás',p:2.2},maintain:{n:'Szinten tartás',p:1.6},gain:{n:'Tömegnövelés',p:1.8}};
const W={kcal:.25,prot:.15,steps:.15,water:.1,workout:.15,strength:.15,creatine:.05}; // az általános fitness súlyai
const NOTICE='<b>Figyelem!</b> A gyakorlatokat körültekintő bemelegítés után végezd egy sorozatban, abszolút bukásig. Lehetőség szerint használj intenzitásnövelő technikákat, ahol tudsz.';
const U='6-12',L='15-20',FAST_MAX=3,FAST_WINDOW=14;

/* Archie's HIT routine. t: orig = Mentzer eredeti, added = kiegészítő, pre = pre-exhaust, post = post-exhaust.
   remove: a volumencsökkentés sorrendje (előbb post-exhaust, utána a kiegészítők hátulról).
   alt: a felhúzás csak akkor szerepel, ha az evezés és a shrug is kimarad (ilyenkor a részleges felhúzás is). */
const DAYS=[
{name:'Mell és hát',ex:[
 {id:'pecdeck',n:'Pec deck',r:U,t:'orig',note:'szuperszett a ferde nyomással'},
 {id:'incline',n:'Ferde fekvenyomás',r:U,t:'orig'},
 {id:'pullover',n:'Pullover (kézisúlyzó vagy gép)',r:U,t:'pre',note:'hát'},
 {id:'pulldown',n:'Szűk fogású lehúzás',r:U,t:'orig'},
 {id:'row',n:'Ülő vagy döntött törzsű evezés',r:U,t:'added'},
 {id:'shrug',n:'Vállvonogatás (shrug)',r:U,t:'added'},
 {id:'deadlift',n:'Felhúzás',r:U,t:'orig',alt:true,note:'az evezés és a shrug helyett'},
 {id:'partialdl',n:'Részleges felhúzás',r:U,t:'post',note:'hát'},
 {id:'dipchest',n:'Tolódzkodás (dip)',r:U,t:'post',note:'mell'}],
 remove:['dipchest','partialdl','shrug','row','pullover']},
{name:'Láb',ex:[
 {id:'legext',n:'Lábnyújtás',r:L,t:'orig',note:'szuperszett a lábtolással'},
 {id:'legpress',n:'Lábtolás',r:L,t:'orig'},
 {id:'hamcurl',n:'Combhajlítás',r:L,t:'added'},
 {id:'calf',n:'Álló vádliemelés',r:L,t:'orig'},
 {id:'seatedcalf',n:'Ülő vádliemelés',r:L,t:'added'},
 {id:'crunch',n:'Súlyzós hasprés',r:L,t:'added'},
 {id:'legraise',n:'Lábemelés',r:L,t:'post',note:'has',bw:true}],
 remove:['legraise','crunch','seatedcalf','hamcurl']},
{name:'Váll és kar',ex:[
 {id:'lateral',n:'Oldalemelés',r:U,t:'orig'},
 {id:'press',n:'Vállból nyomás',r:U,t:'added'},
 {id:'rear',n:'Döntött törzsű oldalemelés',r:U,t:'orig'},
 {id:'bbcurl',n:'Rudas bicepszhajlítás',r:U,t:'orig'},
 {id:'dbcurl',n:'Ülő kézisúlyzós bicepszhajlítás',r:U,t:'added'},
 {id:'skull',n:'Homlokra engedés (skullcrusher)',r:U,t:'added'},
 {id:'triext',n:'Tricepsz nyújtás',r:U,t:'orig',note:'szuperszett a dippel'},
 {id:'diparm',n:'Tolódzkodás (dip)',r:U,t:'orig',bw:true},
 {id:'forearm',n:'Alkar: csuklóhajlítás',r:U,t:'added'}],
 remove:['forearm','skull','dbcurl','press']},
{name:'Láb',ex:[
 {id:'legexthold',n:'Lábnyújtás',r:'hold',t:'orig',note:'statikus tartás, szuperszett a guggolással'},
 {id:'squat',n:'Guggolás',r:L,t:'orig'},
 {id:'hamcurl',n:'Combhajlítás',r:L,t:'added'},
 {id:'calf',n:'Álló vádliemelés',r:L,t:'orig'},
 {id:'seatedcalf',n:'Ülő vádliemelés',r:L,t:'added'},
 {id:'crunch',n:'Súlyzós hasprés',r:L,t:'added'},
 {id:'legraise',n:'Lábemelés',r:L,t:'post',note:'has',bw:true}],
 remove:['legraise','crunch','seatedcalf','hamcurl']}
];
const CAL={name:'Calisthenics',ex:[
 {id:'pullup',n:'Húzódzkodás',r:U,t:'orig',bw:true},
 {id:'dipcal',n:'Tolódzkodás (dip)',r:U,t:'orig',bw:true},
 {id:'pushup',n:'Fekvőtámasz',r:U,t:'orig',bw:true},
 {id:'bulgarian',n:'Bolgár guggolás',r:L,t:'orig',bw:true},
 {id:'hangleg',n:'Függeszkedő lábemelés',r:L,t:'orig',bw:true},
 {id:'deadhang',n:'Deadhang (passzív függés)',r:'sec',t:'orig',bw:true}],remove:[]};
const ALL_EX=(()=>{const m=new Map();[...DAYS,CAL].forEach(D=>D.ex.forEach(e=>{if(!m.has(e.id))m.set(e.id,e);}));return [...m.values()];})();
const exById=id=>ALL_EX.find(e=>e.id===id);

/* ---------- state ---------- */
function fresh(){return {profile:null,days:{},workouts:[],rest:{hours:MIN_REST,log:[]},volume:[0,0,0,0,0],nextDay:0,pressFirst:false,session:null,blocked:[],comp:{},compHandled:{},
 tasks:[],acts:[],actLog:[],timer:null,metro:{bpm:80,beats:4},weights:[],debtLog:{},debtFrom:null,scoreTab:'general',bmrAdj:0,bmrLog:[],results:{pullups:[],deadhang:[],dips:[]},prs:{},gyms:[]};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){const f=fresh();const o=Object.assign(f,s);o.results=Object.assign(fresh().results,s.results||{});while(o.volume.length<4)o.volume.push(0);return o;}}catch(e){}return fresh();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let tab='today',pendingRate=null,recoveryDismissed=null;

function dkey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function kdate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(k,n){const d=kdate(k);d.setDate(d.getDate()+n);return dkey(d);}
function day(k=dkey()){if(!S.days[k])S.days[k]={steps:null,stepsAt:null,food:[],water:[],recovery:null};return S.days[k];}
const fmt=n=>Math.round(n).toLocaleString('hu-HU');
const dec=(n,d=1)=>(+n).toFixed(d).replace('.',',');
const kg=w=>String(Math.round(w*100)/100).replace('.',',');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function num(s){if(s==null||s==='')return NaN;s=String(s).replace(/[\s  ]/g,'');if(/^\d{1,3}([.,]\d{3})+$/.test(s))s=s.replace(/[.,]/g,'');return parseFloat(s.replace(',','.'));}
function hm(ts){return new Date(ts).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});}
function when(ts){return new Date(ts).toLocaleString('hu-HU',{month:'long',day:'numeric',weekday:'long',hour:'2-digit',minute:'2-digit'});}
function dateLong(k){return kdate(k).toLocaleDateString('hu-HU',{month:'long',day:'numeric',weekday:'long'});}
function dateShort(k){return kdate(k).toLocaleDateString('hu-HU',{month:'short',day:'numeric'});}
function dur(ms){const h=Math.ceil(ms/36e5);const d=Math.floor(h/24),r=h%24;return ((d?d+' nap ':'')+(r||!d?r+' óra':'')).trim();}
function meanSd(a,floor=.5){const m=a.reduce((x,y)=>x+y,0)/a.length;const v=a.reduce((x,y)=>x+(y-m)**2,0)/a.length;return {m,s:Math.max(Math.sqrt(v),floor)};}

/* ---------- steps from URL (?steps=1234), sent by the iOS Shortcut ---------- */
(function(){const p=new URLSearchParams(location.search);if(p.has('steps')){const v=Math.round(num(p.get('steps')));if(isFinite(v)&&v>=0){const d=day();d.steps=v;d.stepsAt=Date.now();save();}history.replaceState(null,'',location.pathname);}})();

/* ---------- nutrition ---------- */
function kcalPerStep(P){return P.weight*2.20462*0.000275*(P.height/182.88);}
function targets(P=S.profile){
 const bmr=10*P.weight+6.25*P.height-5*P.age+(P.sex==='m'?5:-161)+(S.bmrAdj||0);
 const base=bmr*1.1,kps=kcalPerStep(P),stepGoal=P.stepGoal||10000;
 const maint10k=base+10000*kps,maintGoal=base+stepGoal*kps;
 let rec;
 if(P.goal==='cut')rec=Math.max(KCAL_FLOOR,maint10k*0.8);
 else if(P.goal==='gain')rec=Math.max(KCAL_FLOOR,maintGoal+GAIN_EXTRA);
 else rec=Math.max(KCAL_FLOOR,maintGoal);
 const kcalT=P.kcalOverride?Math.max(KCAL_FLOOR,P.kcalOverride):rec;
 const waterRec=P.weight*35,waterT=P.waterTarget||waterRec,protT=P.weight*GOALS[P.goal].p;
 const weekly=(maintGoal-kcalT)*7/7700; // + = fogyás, - = hízás (kg/hét)
 let lean=null,bfGoalW=null;
 if(P.bf){lean=P.weight*(1-P.bf/100);bfGoalW=lean/(1-(P.targetBf||(P.sex==='m'?12:22))/100);}
 const goalW=P.goalWeight||bfGoalW;
 let weeks=null;
 if(goalW&&P.goal!=='maintain'){const diff=P.weight-goalW;if(Math.abs(diff)<0.3)weeks=0;else if(diff*weekly>0)weeks=Math.ceil(Math.abs(diff/weekly));}
 return {bmr,base,kps,stepGoal,maintGoal,rec,kcalT,waterRec,waterT,protT,weekly,lean,bfGoalW,goalW,weeks};
}
function calc(k=dkey()){
 const P=S.profile,d=day(k),T=targets(P);
 const steps=d.steps||0,stepK=steps*T.kps,burn=T.base+stepK;
 const stepGoalDay=T.stepGoal;
 const eaten=d.food.reduce((a,f)=>a+(f.kcal||0),0),prot=d.food.reduce((a,f)=>a+(f.protein||0),0),water=d.water.reduce((a,w)=>a+w.ml,0);
 return Object.assign({},T,{steps,stepK,burn,stepGoalDay,eaten,prot,water,G:GOALS[P.goal]});
}

/* ---------- workout schedule ---------- */
const isCal=w=>w.type==='cal';
function isBlocked(k){return S.blocked.includes(k);}
function shiftBlocked(due,keepTime){let g=0;while(isBlocked(dkey(new Date(due)))&&g++<90){const d=new Date(due);due=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,keepTime?d.getHours():8,keepTime?d.getMinutes():0).getTime();}return due;}
function dueBefore(limit){
 const mains=S.workouts.filter(w=>!isCal(w)&&w.at<limit);const last=mains[mains.length-1];if(!last)return null;
 const cals=S.workouts.filter(w=>isCal(w)&&w.at>last.at&&w.at<limit).length;
 return {due:shiftBlocked(last.at+(S.rest.hours+CAL_EXTRA_H*cals)*36e5,true),cals};
}
function dueAt(){const r=dueBefore(Infinity);if(r)return r.due;return isBlocked(dkey())?shiftBlocked(Date.now(),false):null;}
/* Kihagyás csak akkor ront, ha egy hétnél tovább marad el az esedékes edzés (és az adott nap nem bejelentett kihagyás). */
function missed(k){const start=kdate(k).getTime(),r=dueBefore(start+864e5);if(!r)return false;return !isBlocked(k)&&start-r.due>GRACE_DAYS*864e5;}

/* ---------- adherence ---------- */
function fastCount(k){let n=0;for(let i=0;i<FAST_WINDOW;i++){const d=S.days[addDays(k,-i)];if(d&&d.fast)n++;}return n;}
function fastValid(k){return !!(S.days[k]&&S.days[k].fast)&&fastCount(k)<=FAST_MAX;}
/* Kalóriatartozás egy napra: (bevitt − cél) + (lépéscél − lépés) × kcal/lépés. Negatív = előny. */
function dayDebt(k){const c=calc(k);return (c.eaten-c.kcalT)+(c.stepGoal-c.steps)*c.kps;}
/* Lezárt napok értéke rögzül, hogy a későbbi testsúlyváltozás ne írja át a múltat. */
function closedDebt(k){if(S.debtLog[k]==null)S.debtLog[k]=Math.round(dayDebt(k));return S.debtLog[k];}
function debtState(){
 const today=dkey(),from=S.debtFrom||'0000';
 const carry=trackedDays(from,today).reduce((a,k)=>a+closedDebt(k),0);
 const live=dayDebt(today);return {carry,live,total:carry+live};
}
function lossScore(k){ // Fogyás: csak bevitt és elégetett kalória
 const dd=S.days[k]||{};if(dd.fast&&!fastValid(k))return 0; // 3 böjtnap / 14 nap fölött nem javít
 const d=closedDebt(k);return d<=0?1:Math.max(0,1-d/1000);
}
function score(k,final){
 const c=calc(k),T=c.kcalT,e=c.eaten,dd=S.days[k]||{};let ks;
 if(dd.fast)ks=fastValid(k)?1:0;
 else if(S.profile.goal==='cut')ks=e<=T?1:1-(e-T)/1000;
 else{const d=e-T;ks=Math.abs(d)<=150||(!final&&d<0)?1:1-(Math.abs(d)-150)/850;}
 ks=Math.max(0,Math.min(1,ks));
 const parts={kcal:ks,prot:dd.fast?0:Math.min(1,c.prot/c.protT),steps:Math.min(1,c.steps/c.stepGoalDay),water:Math.min(1,c.water/c.waterT),workout:missed(k)?0:1,creatine:dd.creatine?1:0};
 return {parts};
}
const isTracked=k=>!!(S.days[k]&&(S.days[k].food.length||S.days[k].fast));
function trackedDays(from,to){return Object.keys(S.days).filter(k=>k>=from&&k<to&&isTracked(k)).sort();}
/* Bodybuilding: minden gyakorlatot az előző, azonos eszközös alkalmához mér. Elvárás: +1 ismétlés (időzítettnél +5 mp). */
function e1rm(w,reps){return w>0?w*(1+reps/30):reps;}
function strengthStats(){
 const last={},res={n:0,up:0,same:0,down:0,sum:0};
 S.workouts.forEach(w=>Object.entries(w.entries||{}).forEach(([id,e])=>{
  if(!e.done||!e.reps)return;const ex=exById(id);if(!ex)return;
  const r=range(ex),timed=r.sec||r.hold,add=num(e.w)||0,reps=num(e.reps)||0,bw=ex.bw?S.profile.weight:0;
  const val=timed?reps:e1rm(add+bw,reps),key=id+'|'+(e.eq||''),p=last[key];
  if(p){const exp=p.timed?p.reps+5:e1rm(p.load,p.reps+1);let sc;
   if(val>=exp-1e-6){sc=1;res.up++;}else if(val>=p.val-1e-6){sc=.5;res.same++;}else{sc=0;res.down++;}
   res.n++;res.sum+=sc;}
  last[key]={val,reps,load:add+bw,timed};
 }));
 res.v=res.n?res.sum/res.n:null;return res;
}
function allScores(){
 const ks=trackedDays('0000',dkey());
 const out={n:ks.length,loss:null,general:null,parts:null,strength:strengthStats()};
 if(ks.length){
  out.loss=ks.reduce((a,k)=>a+lossScore(k),0)/ks.length;
  const sum={kcal:0,prot:0,steps:0,water:0,workout:0,creatine:0};
  ks.forEach(k=>{const p=score(k,true).parts;Object.keys(sum).forEach(x=>sum[x]+=p[x]);});
  Object.keys(sum).forEach(x=>sum[x]/=ks.length);
  sum.strength=out.strength.v;out.parts=sum;
  const use=Object.keys(W).filter(x=>sum[x]!=null&&(x!=='creatine'||S.profile.creatine));
  const wsum=use.reduce((a,x)=>a+W[x],0);
  out.general=use.reduce((a,x)=>a+W[x]*sum[x],0)/wsum;
 }
 return out;
}

/* ---------- adaptive BMR from real weight ---------- */
function slope(pts){const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;let nu=0,de=0;pts.forEach(p=>{nu+=(p.x-mx)*(p.y-my);de+=(p.x-mx)**2;});return de?nu/de:0;}
function adaptBMR(){
 const today=dkey(),from=addDays(today,-28);
 const ws=S.weights.filter(w=>w.k>=from).sort((a,b)=>a.k<b.k?-1:1);if(ws.length<3)return null;
 const span=(kdate(ws[ws.length-1].k)-kdate(ws[0].k))/864e5;if(span<14)return null;
 const last=S.bmrLog[S.bmrLog.length-1];if(last&&Date.now()-last.at<7*864e5)return null;
 const days=[];for(let k=ws[0].k;k<ws[ws.length-1].k;k=addDays(k,1))days.push(k);
 const tracked=days.filter(isTracked);
 if(tracked.length/days.length<0.8)return null;
 const avgK=tracked.reduce((a,k)=>a+score(k,true).parts.kcal,0)/tracked.length;if(avgK<0.8)return null; // csak következetes időszakból tanul
 let expected=0;days.forEach(k=>{const c=calc(k);expected+=((isTracked(k)?c.eaten:c.kcalT)-c.burn)/7700;});
 const actual=slope(ws.map(w=>({x:(kdate(w.k)-kdate(ws[0].k))/864e5,y:w.kg})))*span;
 const diff=(expected-actual)*7700/span; // + = többet égetsz a becsültnél
 if(Math.abs(diff)<75)return null;
 const step=Math.round(diff*0.5);const before=S.bmrAdj||0;
 S.bmrAdj=Math.max(-MAX_BMR_ADJ,Math.min(MAX_BMR_ADJ,before+step));
 if(S.bmrAdj===before)return null;
 S.bmrLog.push({at:Date.now(),delta:S.bmrAdj-before,expected,actual});
 return 'A valós súlyváltozásod ('+dec(actual,1)+' kg) eltér a várttól ('+dec(expected,1)+' kg), ezért a becsült BMR '+(S.bmrAdj>before?'+':'')+(S.bmrAdj-before)+' kcal-lal módosult.';
}

/* ---------- training logic ---------- */
function dayDef(i){return i==='cal'?CAL:DAYS[i];}
function visibleEx(i,swapDL){
 if(i==='cal')return CAL.ex.slice();
 const D=DAYS[i],gone=new Set(D.remove.slice(0,S.volume[i]||0));
 if(i===0&&swapDL){gone.add('row');gone.add('shrug');gone.add('partialdl');}
 let ex=D.ex.filter(e=>!gone.has(e.id));
 if(i===0){const rs=gone.has('row')&&gone.has('shrug');ex=ex.filter(e=>e.id!=='deadlift'||rs);}
 if(i===2&&S.pressFirst){const a=ex.findIndex(e=>e.id==='lateral'),b=ex.findIndex(e=>e.id==='press');if(a>-1&&b>-1){[ex[a],ex[b]]=[ex[b],ex[a]];}}
 return ex;
}
function range(e){if(e.r==='sec')return {sec:true};if(e.r==='hold')return {hold:true};const [lo,hi]=e.r.split('-').map(Number);return {lo,hi};}
function rangeText(e){const r=range(e);return r.sec?'max idő (mp)':r.hold?'statikus tartás (mp)':`${e.r} ism.`;}
function lastEntry(id,gym,eq){
 const m=[];for(let i=S.workouts.length-1;i>=0;i--){const e=S.workouts[i].entries[id];if(e&&e.done&&e.reps)m.push({e,gym:S.workouts[i].gym||''});}
 return (m.find(x=>gym&&x.gym===gym&&x.e.eq===eq)||m.find(x=>x.e.eq===eq)||m[0]||{}).e||null;
}
/* Ajánlás: előző alkalom +1 ismétlés; ha túllépi a tartomány tetejét, súlyemelés kb. 5%-kal és vissza az aljára. */
function recommend(e,gym,eq){
 const r=range(e),l=lastEntry(e.id,gym,eq);
 if(!l)return r.sec||r.hold?'Első alkalom: tarts ki, ameddig bírod.':e.bw?`Első alkalom: ahány ismétlés bukásig megy. Ha ${r.hi} fölött vagy, tegyél rá plusz súlyt.`:`Első alkalom: olyan súly, amivel ${e.r} ismétlés megy bukásig.`;
 const w=num(l.w)||0,reps=num(l.reps)||0;
 if(r.sec||r.hold)return `Cél: ${w?kg(w)+' kg, ':''}${reps+5} mp (múlt: ${reps} mp)`;
 if(reps+1<=r.hi)return `Cél: ${w?kg(w)+' kg × ':''}${reps+1} ismétlés (múlt: ${w?kg(w)+' kg × ':''}${reps})`;
 if(!w||e.bw)return `Cél: ${reps+1} ismétlés, vagy tegyél rá plusz súlyt (múlt: ${reps})`;
 const nw=Math.max(w+1,Math.round(w*1.05/2.5)*2.5);
 return `Cél: ${kg(nw)} kg × ${r.lo} ismétlés, súlyemelés (múlt: ${kg(w)} kg × ${reps})`;
}
function lastWorkout(){return S.workouts[S.workouts.length-1]||null;}
function logRest(text){S.rest.log.push({at:Date.now(),text});if(S.rest.log.length>60)S.rest.log=S.rest.log.slice(-60);}
function reduceAllVolume(){let any=false;S.volume=S.volume.map((v,i)=>{if(i<4&&v<DAYS[i].remove.length){any=true;return v+1;}return v;});return any;}

function applyRecovery(v){
 const k=dkey();
 const prev=Object.keys(S.days).filter(x=>x<k&&S.days[x].recovery!=null).sort().map(x=>S.days[x].recovery);
 day().recovery=v;
 let low=false,high=false;const recent=[...prev.slice(-2),v];
 if(prev.length>=7){
  const {m,s}=meanSd(prev.slice(-28));low=v<m-s;
  const base=prev.slice(0,-2).slice(-28);
  if(base.length>=5&&recent.length===3){const b=meanSd(base);high=recent.every(x=>x>b.m+b.s);}
 }else{low=v<=2;high=recent.length===3&&recent.every(x=>x===5);}
 let msg='Regeneráció rögzítve.';
 if(low){
  if(S.rest.hours<MAX_REST){S.rest.hours=Math.min(MAX_REST,S.rest.hours+24);msg='Gyenge regeneráció: pihenő +24 óra (most '+dur(S.rest.hours*36e5)+').';logRest('Regeneráció '+v+'/5, pihenő +24 óra → '+S.rest.hours+' óra');}
  else if(reduceAllVolume()){msg='A pihenő már a maximumon van, ezért a volumen csökkent minden napon.';logRest('Regeneráció '+v+'/5 maximális pihenő mellett, volumen −1 minden napon');}
  else msg='Pihenő és volumen is a határon. Ha ez tartós, nézz rá az alvásra és az étkezésre.';
 }else if(high&&S.rest.hours>MIN_REST){
  const lastDown=[...S.rest.log].reverse().find(l=>l.down);
  if(!lastDown||Date.now()-lastDown.at>=3*864e5){S.rest.hours=Math.max(MIN_REST,S.rest.hours-12);msg='Tartósan jó regeneráció: pihenő −12 óra (most '+dur(S.rest.hours*36e5)+').';logRest('3 kiemelkedő nap, pihenő −12 óra → '+S.rest.hours+' óra');S.rest.log[S.rest.log.length-1].down=true;}
 }
 save();return msg;
}
function applyWorkoutRating(i,r){
 if(i==='cal')return 'Calisthenics edzés elmentve, a következő edzés 3 nappal később esedékes.';
 const prev=S.workouts.filter(w=>w.scale===10&&!isCal(w)).map(w=>w.rating);
 let low,high;
 if(prev.length>=5){const {m,s}=meanSd(prev.slice(-20),1);low=r<m-s;high=r>m+s;}else{low=r<=4;high=r>=9;}
 const max=DAYS[i].remove.length,v=S.volume[i]||0,nm=id=>DAYS[i].ex.find(e=>e.id===id).n;
 if(low&&v<max){S.volume[i]=v+1;logRest(DAYS[i].name+': alacsony hatékonyság ('+r+'/10), kikerül: '+nm(DAYS[i].remove[v]));return 'Következő alkalommal kimarad: '+nm(DAYS[i].remove[v])+'.';}
 if(high&&v>0){S.volume[i]=v-1;logRest(DAYS[i].name+': magas hatékonyság ('+r+'/10), visszakerül: '+nm(DAYS[i].remove[v-1]));return 'Következő alkalommal visszakerül: '+nm(DAYS[i].remove[v-1])+'.';}
 return 'Edzés elmentve.';
}

/* ---------- results ---------- */
function bestLogged(id){
 let b=null;S.workouts.forEach(w=>{const e=w.entries[id];if(!e||!e.done||!e.reps)return;const x={w:num(e.w)||0,reps:num(e.reps)||0,k:dkey(new Date(w.at))};
  if(!b||x.w>b.w||(x.w===b.w&&x.reps>b.reps))b=x;});return b;
}
function bestOf(id){const a=bestLogged(id),m=S.prs[id];if(!a)return m||null;if(!m)return a;return (m.w>a.w||(m.w===a.w&&m.reps>a.reps))?m:a;}
function prText(id){const b=bestOf(id),e=exById(id),r=range(e);if(!b)return 'nincs adat';return (b.w?kg(b.w)+' kg × ':'')+b.reps+(r.sec||r.hold?' mp':' ism.')+' · '+dateShort(b.k);}
const BW={pullups:{n:'Max. húzódzkodás',u:'ism.',ids:['pullup']},deadhang:{n:'Deadhang',u:'mp',ids:['deadhang']},dips:{n:'Max. tolódzkodás',u:'ism.',ids:['dipcal','dipchest','diparm']}};
function bwBest(key){

 S.workouts.forEach(w=>BW[key].ids.forEach(id=>{const e=w.entries[id];if(e&&e.done&&e.reps&&!(num(e.w)>0)){const v=num(e.reps);if(!b||v>b.val)b={val:v,k:dkey(new Date(w.at))};}}));
 return b;

function adherenceCard(){

 const pc=v=>v==null?'–':Math.round(v*100)+'%',cl=v=>v==null?'':'c-'+pctCls(v);
 const tabs=[['loss','Fogyás',a.loss],['bb','Bodybuilding',a.strength.v],['general','Általános',a.general]];
 let detail='';
 if(sel==='loss')detail=a.loss==null?'Az első lezárt naplózott nap után jelenik meg.':`Csak a bevitt és az elégetett kalória számít: ha a napi kalóriatartozásod 0 vagy kevesebb, a nap 100%. Ezer kcal tartozásnál 0%. ${a.n} nap alapján.`;
 else if(sel==='bb'){const st=a.strength;detail=st.n?`Elvárás alkalmanként +1 ismétlés (időzítettnél +5 mp). ${st.n} összevetésből: <b class="c-good">${st.up} fejlődés</b>, <b class="c-warn">${st.same} szinten</b>, <b class="c-bad">${st.down} visszaesés</b>.`:'Egy gyakorlat második naplózott alkalma után jelenik meg.';}
 else if(a.parts){const p=x=>a.parts[x]==null?'–':Math.round(a.parts[x]*100)+'%';
  detail=`<div class="grid5" style="margin-top:0">
  <div class="chip"><b>${p('kcal')}</b><span>kalória</span></div><div class="chip"><b>${p('prot')}</b><span>fehérje</span></div>
  <div class="chip"><b>${p('steps')}</b><span>lépés</span></div><div class="chip"><b>${p('water')}</b><span>víz</span></div><div class="chip"><b>${p('workout')}</b><span>edzés</span></div></div>
  <div class="grid5"><div class="chip"><b>${p('strength')}</b><span>erő</span></div>${S.profile.creatine?`<div class="chip"><b>${p('creatine')}</b><span>kreatin</span></div>`:''}</div>
  <div class="hint">${a.n} nap alapján, minden szempont együtt.</div>`;}
 else detail='Az első lezárt naplózott nap után jelenik meg.';
 return `<div class="card"><div class="label">Célteljesítés · összesített</div>
 <div class="grid3">${tabs.map(([k,n,v])=>`<button class="${k===sel?'on':''}" data-a="scoreTab" data-v="${k}"><b class="${cl(v)}">${pc(v)}</b><span>${n}</span></button>`).join('')}</div>
 <div class="small" style="margin-top:12px">${detail}</div></div>`;
}
function stepsTxt(n){return fmt(Math.ceil(n/100)*100)+' lépés';}
function debtCard(){
 const c=calc(),st=debtState(),t=st.total,cls=t>0?'c-bad':'c-good';
 let pay='';
 if(t>0){
  const steps=t/c.kps,cap=MAX_STEPS-c.stepGoal,days=Math.ceil(steps/cap);
  pay=`<div style="margin-top:10px">0-ra hozni: <b>${stepsTxt(steps)}</b>`;
  if(t>c.bmr){const rest=Math.max(0,t-c.kcalT);pay+=` / <b>1 nap böjt${rest>0?' + '+stepsTxt(rest/c.kps):''}</b>`;}
  pay+=`</div>`;
  if(days>1)pay+=`<div class="hint">Naponta legfeljebb ${fmt(MAX_STEPS)} lépéssel ez kb. ${days} nap a lépéscéled fölött.</div>`;
  if(t>c.bmr)pay+=`<div class="hint">Egy böjtnap a napi kalóriacélodnyit (${fmt(c.kcalT)} kcal) hoz le, ha közben a lépéscélt tartod.</div>`;
 }else pay=`<div class="hint" style="margin-top:8px">Nincs tartozásod.</div>`;
 const sg=v=>(v>0?'+':v<0?'−':'')+fmt(Math.abs(v));
 return `<div class="card"><div class="row between"><div class="label" style="margin:0">Kalóriatartozás</div>
  <button class="sm ghost" data-a="debtReset">Nullázás</button></div>
 <div class="big ${cls}" style="margin-top:4px">${sg(t)} <span class="small muted" style="font-weight:600">kcal</span></div>
 <div class="muted small">ma ${sg(st.live)} · korábbi napokból ${sg(st.carry)}</div>${pay}
 <div class="hint">Tartozás = (bevitt − kalóriacél) + (lépéscél − megtett lépés) × ${dec(c.kps*1000,0)} kcal/ezer lépés. Negatív érték előnyt jelent.</div></div>`;
}
function goalLine(c){
 if(S.profile.goal==='maintain')return '';
 if(!c.goalW)return `<div class="hint" style="margin-top:8px">Hozzávetőleges időtartam a cél eléréséig: add meg a testzsírt vagy a céltestsúlyt a Profilban.</div>`;
 if(c.weeks===0)return `<div class="hint c-good" style="margin-top:8px">Elérted a céltestsúlyt (${dec(c.goalW)} kg).</div>`;
 if(c.weeks==null)return `<div class="hint" style="margin-top:8px">A célod (${dec(c.goalW)} kg) és a választott irány nem egyezik, nézd át a Profilt.</div>`;
 return `<div style="margin-top:10px">Hozzávetőleges időtartam a cél eléréséig: <b>${c.weeks} hét</b>.</div><div class="hint">${dec(S.profile.weight)} → ${dec(c.goalW)} kg, kb. ${dec(Math.abs(c.weekly),2)} kg/hét</div>`;
}

function fastCard(k){

  <div class="muted small">${on?(valid?'Ma böjtnap, a kalóriastatisztikában teljesítettnek számít.':'A 14 napos keret betelt, ez a böjtnap nem javít a statisztikán.'):`Az utóbbi 14 napban: ${n}/${FAST_MAX} böjtnap`}</div></div>
  <button class="toggle fast ${on?'on':''}" data-a="toggleFast" style="min-width:110px">${on?'✓ Böjtnap':'Böjtnap'}</button></div></div>`;

function exTag(e){return e.t==='post'?`<span class="tag post">post-exhaust · ${e.note} · kihagyható</span>`:e.t==='pre'?`<span class="tag pre">pre-exhaust · ${e.note}</span>`:e.t==='added'?'<span class="tag added">kiegészítő</span>':'';}

/* ---------- alternatív tevékenységek ---------- */
let actOpen=null;
function actById(id){return S.acts.find(a=>a.id===id);}
function subById(a,id){return a&&a.subs.find(x=>x.id===id);}
function hms(ms){const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sec).padStart(2,'0');}
function hmText(ms){const m=Math.round(ms/6e4),h=Math.floor(m/60),r=m%60;return h?(h+' óra'+(r?' '+r+' perc':'')):r+' perc';}
function runMs(){return S.timer?Date.now()-S.timer.start:0;}
function actMs(actId,subId,dayK){
 let ms=S.actLog.filter(l=>l.act===actId&&(!subId||l.sub===subId)&&(!dayK||dkey(new Date(l.start))===dayK)).reduce((a,l)=>a+(l.end-l.start),0);
 const t=S.timer;if(t&&t.act===actId&&(!subId||t.sub===subId)&&(!dayK||dkey(new Date(t.start))===dayK))ms+=runMs();
 return ms;
}
function stopTimer(){
 const t=S.timer;if(!t)return 0;const end=Date.now(),ms=end-t.start;
 if(ms>=5000)S.actLog.push({id:uid(),act:t.act,sub:t.sub,start:t.start,end});
 S.timer=null;save();return ms;
}
function startTimer(act,sub){if(S.timer)stopTimer();S.timer={act,sub,start:Date.now()};save();}
function runBar(){
 const t=S.timer;if(!t||(tab==='acts'&&actOpen===t.act))return '';const a=actById(t.act),sb=subById(a,t.sub);if(!a){S.timer=null;return '';}

/* ---------- csatolmányok: IndexedDB-ben (a localStorage túl kicsi a hanghoz és videóhoz) ---------- */
const MEDIA_URLS={};let dbP=null;
function db(){if(!dbP)dbP=new Promise((res,rej)=>{const r=indexedDB.open('goldenMeanMedia',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return dbP;}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('media',mode),st=tx.objectStore('media'),r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
const putBlob=(id,b)=>idb('readwrite',st=>st.put(b,id)),getBlob=id=>idb('readonly',st=>st.get(id)),delBlob=id=>idb('readwrite',st=>st.delete(id));
async function hydrateMedia(){
 for(const el of document.querySelectorAll('[data-media]')){const id=el.dataset.media;
  if(!MEDIA_URLS[id]){try{const b=await getBlob(id);if(!b){el.replaceWith(Object.assign(document.createElement('div'),{className:'hint',textContent:'A fájl nem található ezen az eszközön.'}));continue;}MEDIA_URLS[id]=URL.createObjectURL(b);}catch(e){continue;}}
  if(el.getAttribute('src')!==MEDIA_URLS[id])el.src=MEDIA_URLS[id];}
}
async function attachBlob(tid,blob,name){
 const a=actById(actOpen),t=a&&a.trophies.find(x=>x.id===tid);if(!t)return;
 const type=(blob.type||'').startsWith('video')?'video':'audio',id=uid();
 try{await putBlob(id,blob);}catch(e){toast('Nem sikerült menteni. Lehet, hogy betelt a tárhely.');return;}
 (t.media=t.media||[]).push({id,type,name,size:blob.size,k:dkey()});save();render();toast('Csatolva.');
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
}
const REC={t:null,rec:null,chunks:[]};
async function recToggle(tid){
 if(REC.rec){REC.rec.stop();return;}
 if(!navigator.mediaDevices||!window.MediaRecorder){toast('Ez az eszköz nem támogatja a hangfelvételt.');return;}
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Nincs engedély a mikrofonhoz.');return;}
 const mime=['audio/mp4','audio/webm','audio/aac'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
 const rec=new MediaRecorder(stream,mime?{mimeType:mime}:{});REC.t=tid;REC.rec=rec;REC.chunks=[];
 rec.ondataavailable=e=>{if(e.data.size)REC.chunks.push(e.data);};
 rec.onstop=()=>{stream.getTracks().forEach(x=>x.stop());const blob=new Blob(REC.chunks,{type:rec.mimeType||mime||'audio/mp4'});const t=REC.t;REC.t=null;REC.rec=null;
  if(blob.size)attachBlob(t,blob,'Hangfelvétel '+new Date().toLocaleString('hu-HU',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}));else render();};
 rec.start();render();
}

/* ---------- metronóm (Web Audio, előre ütemezett kattanások) ---------- */
const M={ctx:null,on:false,next:0,beat:0,timer:null,taps:[]};
function metroCard(){
 const m=S.metro;
 return `<div class="card"><div class="row between"><div class="label" style="margin:0">Metronóm</div><button class="sm ghost" data-a="metroRemove">Eltávolítás</button></div>
 <div class="row between" style="margin-top:6px"><button class="sm" data-a="bpm" data-v="-5">−5</button><button class="sm" data-a="bpm" data-v="-1">−1</button>
  <div class="bpm" id="bpmVal">${m.bpm}</div><button class="sm" data-a="bpm" data-v="1">+1</button><button class="sm" data-a="bpm" data-v="5">+5</button></div>
 <div class="muted small" style="text-align:center">BPM</div>
 <input type="range" id="bpmRange" min="30" max="260" value="${m.bpm}">
 <div class="beats" id="beats">${Array.from({length:m.beats||1},(_,i)=>`<i class="${i===0&&m.beats>1?'acc':''}"></i>`).join('')}</div>
 <div class="field"><span>Ütem</span>${seg('beats',[['1','—'],['2','2/4'],['3','3/4'],['4','4/4'],['6','6/8']],String(m.beats),'mini')}</div>
 <div class="row"><button class="${M.on?'danger ghost':'primary'} grow" data-a="metro">${M.on?'Stop':'Indítás'}</button><button data-a="tap">Tap</button></div>
 <div class="hint">iPhone-on a némítókapcsoló elnémíthatja. Képernyőzáráskor leáll.</div></div>`;
}
function click(time,acc){
 const o=M.ctx.createOscillator(),g=M.ctx.createGain();o.frequency.value=acc?1500:1000;
 g.gain.setValueAtTime(0.0001,time);g.gain.exponentialRampToValueAtTime(acc?0.9:0.55,time+0.001);g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
 o.connect(g).connect(M.ctx.destination);o.start(time);o.stop(time+0.06);
}
function sched(){
 while(M.next<M.ctx.currentTime+0.12){
  const n=S.metro.beats||1,b=M.beat%n;click(M.next,n>1&&b===0);
  const delay=Math.max(0,(M.next-M.ctx.currentTime)*1000);setTimeout(()=>flash(b),delay);
  M.next+=60/S.metro.bpm;M.beat++;
 }
}
function flash(b){const el=document.querySelectorAll('#beats i');el.forEach((x,i)=>x.classList.toggle('on',i===b));setTimeout(()=>el.forEach(x=>x.classList.remove('on')),90);}
function metroStart(){
 if(!M.ctx)M.ctx=new (window.AudioContext||window.webkitAudioContext)();
 M.ctx.resume();M.on=true;M.beat=0;M.next=M.ctx.currentTime+0.06;sched();M.timer=setInterval(sched,25);
}
function metroStop(){M.on=false;clearInterval(M.timer);M.timer=null;}
function setBpm(v){S.metro.bpm=Math.max(30,Math.min(260,Math.round(v)));save();const a=$('#bpmVal'),r=$('#bpmRange');if(a)a.textContent=S.metro.bpm;if(r)r.value=S.metro.bpm;}
setInterval(()=>{if(!S.timer)return;document.querySelectorAll('[data-live=run]').forEach(e=>e.textContent=hms(runMs()));
 if(tab==='acts'&&actOpen){const t=$('[data-live=today]'),T=$('[data-live=total]');if(t)t.textContent=hmText(actMs(actOpen,null,dkey()));if(T)T.textContent=hmText(actMs(actOpen));}},1000);

/* ---------- munka: napi feladatok, alfeladatokkal; a lezáratlanok átnyúlnak a következő napra ---------- */
let workDay=null,taskOpen=null;
function taskVisible(t,k){return t.date<=k&&(!t.done||t.doneDay>=k);}
function taskDoneOn(t,k){return t.done&&t.doneDay<=k;}
function daysBetween(a,b){return Math.round((kdate(b)-kdate(a))/864e5);}
function setTaskDone(t,v,k){t.done=v;t.doneDay=v?k:null;if(v)t.subs.forEach(x=>x.done=true);}
function viewWork(){
 const today=dkey(),k=workDay||today,isToday=k===today,past=k<today;
 const list=S.tasks.filter(t=>taskVisible(t,k)).sort((a,b)=>(taskDoneOn(a,k)-taskDoneOn(b,k))||(a.date<b.date?-1:a.date>b.date?1:0));
 const open=list.filter(t=>!taskDoneOn(t,k)).length,done=list.length-open;
 const label=isToday?'Ma':k===addDays(today,1)?'Holnap':k===addDays(today,-1)?'Tegnap':'';
 return `<h1>Munka</h1><div class="sub">Napi feladatok. A le nem zártak átkerülnek a következő napra.</div>
 <div class="daynav"><button class="sm" data-a="workDay" data-v="-1" aria-label="Előző nap">‹</button>
  <div style="text-align:center"><b>${label||dateLong(k)}</b>${label?`<div class="muted small">${dateLong(k)}</div>`:''}</div>
  <button class="sm" data-a="workDay" data-v="1" aria-label="Következő nap">›</button></div>
 ${!isToday?`<button class="sm ghost block" style="margin-bottom:12px" data-a="workDay" data-v="0">Vissza a mai naphoz</button>`:''}
 <div class="card">${list.length?`<div class="row between"><div class="label" style="margin:0">${open} nyitott · ${done} kész</div></div>`:''}
  ${list.length?`<div style="margin-top:4px">${list.map(t=>taskHtml(t,k)).join('')}</div>`:`<div class="hint">${past?'Ezen a napon nem volt feladat.':'Nincs feladat erre a napra.'}</div>`}
  ${past?'':`<form class="inline" data-form="newTask"><input id="taskIn" placeholder="Új feladat" autocomplete="off" enterkeyhint="done"><button class="sm primary" type="submit">Hozzáadás</button></form>`}</div>
 <div class="hint">Koppints egy feladatra a késszé tételhez, újabb koppintással visszanyitod. Az összes alfeladat kipipálása lezárja a fő feladatot is.</div>`;
}
function taskHtml(t,k){
 const d=taskDoneOn(t,k),carried=!d&&t.date<k?daysBetween(t.date,k):0,subsDone=t.subs.filter(x=>x.done).length,openSubs=taskOpen===t.id;
 return `<div class="task ${d?'done':''}"><div class="trow" data-a="taskToggle" data-v="${t.id}"><span class="tick">✓</span>
  <div class="grow"><div class="ttl">${esc(t.title)}</div>
   ${carried||t.subs.length?`<div class="small muted">${carried?`<span class="carry">áthozva ${carried} napja</span>${t.subs.length?' · ':''}`:''}${t.subs.length?`${subsDone}/${t.subs.length} alfeladat`:''}</div>`:''}</div>
  <button class="ibtn" data-a="taskSubs" data-v="${t.id}" aria-label="Alfeladatok">${openSubs?'−':'+'}</button>
  <button class="ibtn" data-a="taskEdit" data-v="${t.id}" aria-label="Szerkesztés">⋯</button></div>
 ${t.subs.length||openSubs?`<div class="subs">${t.subs.map(x=>`<div class="sub ${x.done?'done':''}"><div class="trow" data-a="subToggle" data-v="${t.id}|${x.id}"><span class="tick">✓</span><div class="grow ttl">${esc(x.title)}</div>
   ${openSubs?`<button class="ibtn" data-a="subDel" data-v="${t.id}|${x.id}" aria-label="Törlés">×</button>`:''}</div></div>`).join('')}
  ${openSubs?`<form class="inline" data-form="newSubTask" data-v="${t.id}" style="margin:4px 0 8px"><input id="subTaskIn" placeholder="Új alfeladat" autocomplete="off"><button class="sm" type="submit">Hozzáadás</button></form>`:''}</div>`:''}</div>`;
}

function render(){
 const app=$('#app'),nav=$('#nav');
 if(!S.profile){app.innerHTML=profileForm(true);nav.hidden=true;return;}
 nav.hidden=false;
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
 app.innerHTML=runBar()+(tab==='workout'?viewWorkout():tab==='work'?viewWork():tab==='acts'?viewActs():tab==='results'?viewResults():tab==='settings'?viewSettings():viewToday());
 if(tab==='acts')hydrateMedia();

}

/* ---------- sheets & toast ---------- */
function sheet(title,sub,cb,cancel,scale=5){
 closeSheet();pendingRate=cb;const tt=$('#toast');if(tt)tt.hidden=true;
 const bg=document.createElement('div');bg.className='sheet-bg';bg.id='sheet';
 const btns=scale===5?LABELS.map((l,i)=>`<button data-a="rate" data-v="${i+1}">${i+1}<small>${l}</small></button>`).join('')
  :Array.from({length:10},(_,i)=>`<button data-a="rate" data-v="${i+1}">${i+1}</button>`).join('');
 bg.innerHTML=`<div class="sheet"><h2>${title}</h2><div class="muted small">${sub}</div><div class="rate">${btns}</div>
 ${cancel?`<button class="ghost block" data-a="closeSheet">${cancel}</button>`:''}</div>`;
 document.body.appendChild(bg);
}
function closeSheet(){const s=$('#sheet');if(s)s.remove();pendingRate=null;}
let toastT;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4500);}
function maybeAskRecovery(force){
 if(!S.profile||$('#sheet')||day().recovery!=null)return;
 if(!force&&recoveryDismissed===dkey())return;
 sheet('Mennyire érzed magad regeneráltnak?','Napi első bejelentkezés. Ez alapján igazodik a pihenőidő.',v=>{toast(applyRecovery(v));render();},'Később');
}
function startSession(type){
 S.session={day:type==='cal'?'cal':S.nextDay,type,startedAt:Date.now(),entries:{},swapDL:false,gym:(lastWorkout()||{}).gym||''};
 save();tab='workout';render();window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,v=b.dataset.v,d=day();
 switch(a){
  case 'tab':tab=v;if(v!=='acts'&&M.on)metroStop();render();window.scrollTo(0,0);break;
  case 'workDay':workDay=+v===0?null:addDays(workDay||dkey(),+v);if(workDay===dkey())workDay=null;taskOpen=null;render();break;
  case 'taskToggle':{const t=S.tasks.find(x=>x.id===v),k=workDay||dkey();if(!t)return;setTaskDone(t,!taskDoneOn(t,k),k);save();render();break;}
  case 'subToggle':{const [tid,sid]=v.split('|'),t=S.tasks.find(x=>x.id===tid),x=t&&t.subs.find(y=>y.id===sid),k=workDay||dkey();if(!x)return;
   x.done=!x.done;if(t.subs.every(y=>y.done)){if(!t.done){t.done=true;t.doneDay=k;toast('Minden alfeladat kész, a feladat lezárva.');}}else if(t.done){t.done=false;t.doneDay=null;}
   save();render();break;}
  case 'taskSubs':taskOpen=taskOpen===v?null:v;render();{const i=$('#subTaskIn');if(i)i.focus();}break;
  case 'subDel':{const [tid,sid]=v.split('|'),t=S.tasks.find(x=>x.id===tid);t.subs=t.subs.filter(y=>y.id!==sid);save();render();break;}
  case 'taskEdit':{const t=S.tasks.find(x=>x.id===v);const n=prompt('Feladat neve (üresen hagyva törlöd)',t.title);if(n===null)return;
   if(!n.trim()){if(confirm('Törlöd a feladatot az alfeladataival együtt?')){S.tasks=S.tasks.filter(x=>x.id!==v);save();render();}return;}t.title=n.trim();save();render();break;}
  case 'trophyOpen':trophyOpen=trophyOpen===v?null:v;render();break;
  case 'trophyWin':{const t=actById(actOpen).trophies.find(x=>x.id===v);t.goal=false;t.k=dkey();save();render();toast('Gratulálok, '+TIERS[t.tier].toLowerCase()+' trófea megszerezve!');break;}
  case 'recToggle':recToggle(v);break;
  case 'mediaDel':{const [tid,mid]=v.split('|'),t=actById(actOpen).trophies.find(x=>x.id===tid);if(!confirm('Törlöd ezt a csatolmányt?'))return;
   t.media=t.media.filter(x=>x.id!==mid);delBlob(mid).catch(()=>{});if(MEDIA_URLS[mid]){URL.revokeObjectURL(MEDIA_URLS[mid]);delete MEDIA_URLS[mid];}save();render();break;}
  case 'trophyEdit':{const a=actById(actOpen),t=a.trophies.find(x=>x.id===v);
   const n=prompt('Trófea neve (üresen hagyva törlöd)',t.name);if(n===null)return;
   if(!n.trim()){if(confirm('Törlöd ezt a trófeát a csatolmányaival együtt?')){(t.media||[]).forEach(m=>delBlob(m.id).catch(()=>{}));a.trophies=a.trophies.filter(x=>x.id!==v);save();render();}return;}
   const tr=prompt('Minősítés: 1 = arany, 2 = ezüst, 3 = bronz',String(TIER_ORDER[t.tier]+1));if(tr===null)return;
   t.name=n.trim();t.tier=['gold','silver','bronze'][Math.round(num(tr))-1]||t.tier;save();render();break;}
  case 'openAct':actOpen=v;render();window.scrollTo(0,0);break;
  case 'closeAct':actOpen=null;if(M.on)metroStop();render();break;
  case 'timerStart':startTimer(actOpen,v);render();break;
  case 'timerStop':{const ms=stopTimer();render();toast(ms<5000?'Túl rövid, nem rögzítettem.':hmText(ms)+' rögzítve.');break;}
  case 'delLog':if(confirm('Törlöd ezt az alkalmat?')){S.actLog=S.actLog.filter(l=>l.id!==v);save();render();}break;
  case 'editAct':{const a=actById(v);const n=prompt('Név',a.name);if(n===null)return;
   if(!n.trim()){if(confirm('Üres név: törlöd a(z) '+a.name+' tevékenységet és minden rögzített idejét?')){S.acts=S.acts.filter(x=>x.id!==v);S.actLog=S.actLog.filter(l=>l.act!==v);if(S.timer&&S.timer.act===v)S.timer=null;actOpen=null;save();render();}return;}
   const g=prompt('Napi cél (perc, 0 = nincs)',a.goal||0);if(g===null)return;a.name=n.trim();a.goal=Math.max(0,Math.round(num(g)||0));save();render();break;}
  case 'manualLog':{const a=actById(actOpen);if(!a.subs.length){toast('Előbb adj hozzá egy területet.');return;}
   const names=a.subs.map((x,i)=>(i+1)+'. '+x.name).join('\n');const i=prompt('Melyik terület?\n'+names,'1');if(i===null)return;const sb=a.subs[Math.round(num(i))-1];if(!sb){toast('Nincs ilyen terület.');return;}
   const m=prompt('Hány percet gyakoroltál ma?');if(m===null)return;const mins=num(m);if(!(mins>0&&mins<=1440)){toast('Érvénytelen időtartam.');return;}
   const end=Date.now();S.actLog.push({id:uid(),act:a.id,sub:sb.id,start:end-mins*6e4,end});save();render();toast(hmText(mins*6e4)+' rögzítve.');break;}
  case 'bpm':setBpm(S.metro.bpm+(+v));break;
  case 'metroRemove':{const a=actById(actOpen);if(M.on)metroStop();a.metro=false;save();render();toast('Metronóm eltávolítva. Az oldal alján visszateheted.');break;}
  case 'metroAdd':actById(actOpen).metro=true;save();render();break;
  case 'metro':if(M.on)metroStop();else metroStart();render();break;
  case 'tap':{const t=performance.now();M.taps=M.taps.filter(x=>t-x<2500);M.taps.push(t);
   if(M.taps.length>=2){const d=(M.taps[M.taps.length-1]-M.taps[0])/(M.taps.length-1);setBpm(60000/d);}break;}
  case 'seg':{const g=b.closest('.seg');g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('#f_'+g.dataset.seg).value=v;
   if(g.dataset.seg==='beats'){S.metro.beats=+v;M.beat=0;save();render();}
   if(g.dataset.seg.startsWith('eq_')&&S.session){const id=g.dataset.seg.slice(3);const en=S.session.entries[id]||(S.session.entries[id]={});en.eq=v;save();
    const reco=g.closest('.ex').querySelector('.reco');if(reco)reco.textContent=recommend(exById(id),S.session.gym,v);}
   break;}
  case 'saveProfile':{
   const old=S.profile||{};
   const P={age:num($('#f_age').value),sex:$('#f_sex').value,weight:num($('#f_weight').value),height:num($('#f_height').value),goal:$('#f_goal').value,creatine:$('#f_creatine').value==='1',
    bf:num($('#f_bf').value)||null,targetBf:num($('#f_tbf').value)||null,goalWeight:num($('#f_gw').value)||null,stepGoal:+$('#f_sg').value||10000,
    kcalOverride:$('#f_kcal')?(num($('#f_kcal').value)||null):(old.kcalOverride||null),waterTarget:$('#f_water')?(num($('#f_water').value)||null):(old.waterTarget||null)};
   if(!(P.age>=13&&P.age<=100)||!(P.weight>=30&&P.weight<=300)||!(P.height>=120&&P.height<=230)){toast('Ellenőrizd az életkort, a testsúlyt és a magasságot.');return;}
   if((P.bf&&!(P.bf>=3&&P.bf<=60))||(P.targetBf&&!(P.targetBf>=3&&P.targetBf<=60))){toast('A testzsír 3 és 60% között lehet.');return;}
   if(P.goalWeight&&!(P.goalWeight>=30&&P.goalWeight<=300)){toast('Érvénytelen céltestsúly.');return;}
   if(P.waterTarget&&P.waterTarget<500){toast('A vízcél legalább 500 ml legyen.');return;}
   let msg='Profil elmentve.';
   if(P.kcalOverride&&P.kcalOverride<KCAL_FLOOR){P.kcalOverride=KCAL_FLOOR;msg='A kalóriacél nem lehet '+fmt(KCAL_FLOOR)+' alatt, ennyire állítottam.';}
   const first=!S.profile;S.profile=P;save();if(first)tab='today';render();toast(msg);break;}
  case 'water':d.water.push({id:uid(),ml:+v});save();render();break;
  case 'waterCustom':{const r=prompt('Mennyi vizet ittál? (dl)');if(r===null)return;const n=num(r);if(!(n>0&&n<50)){toast('Érvénytelen mennyiség.');return;}d.water.push({id:uid(),ml:Math.round(n*100)});save();render();break;}
  case 'waterUndo':d.water.pop();save();render();break;
  case 'delFood':d.food=d.food.filter(f=>f.id!==v);save();render();break;
  case 'scoreTab':S.scoreTab=v;save();render();break;
  case 'debtReset':if(confirm('A korábbi napok tartozása (vagy előnye) törlődik, és mától indul újra a számolás. Biztos?')){S.debtFrom=dkey();save();render();toast('Kalóriatartozás nullázva.');}break;
  case 'unblock':S.blocked=S.blocked.filter(k=>k!==v);save();render();break;
  case 'delWeight':S.weights=S.weights.filter(w=>w.k!==v);save();render();break;
  case 'bwAdd':{const r=prompt(BW[v].n+' ('+BW[v].u+')');if(r===null)return;const n=Math.round(num(r));if(!(n>=0&&n<10000)){toast('Érvénytelen érték.');return;}S.results[v].push({val:n,k:dkey()});save();render();toast('Rögzítve.');break;}
  case 'prAdd':{const ex=exById(v),r=range(ex),timed=r.sec||r.hold;
   const w=prompt(ex.n+': súly (kg)'+(ex.bw?', plusz súly vagy 0':''),'');if(w===null)return;
   const reps=prompt(ex.n+': '+(timed?'idő (mp)':'ismétlés'),'');if(reps===null)return;
   const W_=num(w)||0,R=Math.round(num(reps));if(!(R>0)){toast('Érvénytelen ismétlésszám.');return;}
   S.prs[v]={w:W_,reps:R,k:dkey()};save();render();toast('Rekord rögzítve.');break;}
  case 'toggleCreatine':d.creatine=!d.creatine;save();render();break;
  case 'toggleFast':{if(!d.fast&&fastCount(dkey())>=FAST_MAX&&!confirm('Ez már a '+(FAST_MAX+1)+'. böjtnap 14 napon belül, nem javít a statisztikán. Így is jelölöd?'))return;
   if(!d.fast&&d.food.length&&!confirm('Ma már naplóztál ételt. Biztosan böjtnap?'))return;d.fast=!d.fast;save();render();break;}
  case 'pasteSteps':{if(!navigator.clipboard||!navigator.clipboard.readText){toast('A vágólap itt nem érhető el, írd be kézzel.');return;}
   navigator.clipboard.readText().then(t=>{const n=Math.round(num((t||'').trim()));if(!isFinite(n)||n<0||n>100000){toast('A vágólapon nincs lépésszám.');return;}const dd=day();dd.steps=n;dd.stepsAt=Date.now();save();render();toast(fmt(n)+' lépés beillesztve.');}).catch(()=>toast('Nem sikerült a vágólapot olvasni.'));break;}
  case 'askRecovery':maybeAskRecovery(true);break;
  case 'rate':{const cb=pendingRate;closeSheet();if(cb)cb(+v);break;}
  case 'closeSheet':if(pendingRate&&$('#sheet')&&day().recovery==null)recoveryDismissed=dkey();closeSheet();break;
  case 'swapPress':S.pressFirst=!S.pressFirst;save();render();break;
  case 'swapDL':S.session.swapDL=!S.session.swapDL;save();render();break;
  case 'startWorkout':{const due=dueAt();if(due&&Date.now()<due&&!confirm('Még '+dur(due-Date.now())+' van hátra a pihenőből. Biztosan most edzel?'))return;startSession('main');break;}
  case 'startCal':if(confirm('Calisthenics edzés: a következő főedzés 3 nappal később lesz esedékes. Indítod?'))startSession('cal');break;
  case 'toggleEx':{const en=S.session.entries[v]||(S.session.entries[v]={}),ex=exById(v);
   if(!en.done&&(!en.reps||(!ex.bw&&!en.w))){toast('Előbb írd be a '+(ex.bw?'':'súlyt és az ')+'ismétlésszámot.');return;}
   en.done=!en.done;save();b.classList.toggle('on',en.done);break;}
  case 'cancelWorkout':if(confirm('Elveted ezt az edzést? Nem kerül mentésre.')){S.session=null;save();render();}break;
  case 'finishWorkout':{
   const s=S.session,ids=visibleEx(s.day,s.swapDL).map(e=>e.id);
   for(const id of ids){const en=s.entries[id];if(!en)continue;const ex=exById(id);
    if(en.done&&(!en.reps||(!ex.bw&&!en.w))){toast(ex.n+': hiányzik a súly vagy az ismétlésszám.');return;}}
   const done=ids.some(id=>s.entries[id]&&s.entries[id].done);
   if(!done&&!confirm('Egy gyakorlatot sem jelöltél késznek. Így is mented?'))return;
   sheet('Mennyire volt hatékony az edzés?','1 = hatástalan, 10 = maximálisan hatékony.'+(s.day==='cal'?'':' Ez alapján igazodik a volumen.'),r=>{
    const s=S.session,entries={};ids.forEach(id=>{if(s.entries[id])entries[id]=s.entries[id];});
    const msg=applyWorkoutRating(s.day,r);
    S.workouts.push({at:Date.now(),type:s.type||'main',day:s.day,rating:r,scale:10,gym:s.gym||'',entries});
    if(s.gym&&!S.gyms.includes(s.gym))S.gyms.push(s.gym);
    if(s.type!=='cal')S.nextDay=(s.day+1)%4;
    S.session=null;save();render();window.scrollTo(0,0);
    const due=dueAt();toast(msg+(due?' Következő edzés: '+when(due)+'.':''));},'Mégse',10);break;}
  case 'resetRest':S.rest.hours=MIN_REST;logRest('Pihenő kézzel visszaállítva 48 órára');save();render();break;
  case 'resetVolume':S.volume=[0,0,0,0];logRest('Volumen kézzel visszaállítva teljesre');save();render();break;
  case 'resetAll':if(confirm('Minden adat törlődik: profil, napló, edzések, eredmények. Biztos?')){S=fresh();save();render();}break;
 }
});
document.addEventListener('submit',e=>{
 const f=e.target.dataset.form;if(!f)return;e.preventDefault();
 if(f==='food'){
  const name=$('#fn').value.trim(),kcal=num($('#fk').value),p=num($('#fp').value);
  if(!name){toast('Adj meg egy megnevezést.');return;}
  if(!(kcal>=0)){toast('Add meg a kalóriát.');return;}
  day().food.push({id:uid(),name,kcal:Math.round(kcal),protein:p>0?Math.round(p*10)/10:0});save();render();
  const n=$('#fn');if(n)n.focus();
 }else if(f==='newTrophy'){
  const n=$('#trophyIn').value.trim();if(!n){toast('Add meg a trófea nevét.');return;}
  const a=actById(actOpen);const goal=$('#f_tstate').value!=='won';(a.trophies=a.trophies||[]).push({id:uid(),name:n,tier:$('#f_tier').value||'gold',k:dkey(),goal,media:[]});save();render();toast(goal?'Elérendő trófea hozzáadva.':'Trófea hozzáadva.');
 }else if(f==='newTask'){
  const n=$('#taskIn').value.trim();if(!n)return;S.tasks.push({id:uid(),title:n,date:workDay||dkey(),done:false,doneDay:null,subs:[]});save();render();const i=$('#taskIn');if(i)i.focus();
 }else if(f==='newSubTask'){
  const n=$('#subTaskIn').value.trim();if(!n)return;const t=S.tasks.find(x=>x.id===e.target.dataset.v);t.subs.push({id:uid(),title:n,done:false});
  if(t.done){t.done=false;t.doneDay=null;}save();render();const i=$('#subTaskIn');if(i)i.focus();
 }else if(f==='newAct'){
  const n=$('#actName').value.trim(),g=Math.round(num($('#actGoal').value)||0);if(!n){toast('Adj nevet a tevékenységnek.');return;}
  const a={id:uid(),name:n,goal:Math.max(0,g),subs:[],metro:$('#f_newMetro').value!=='0'};S.acts.push(a);actOpen=a.id;save();render();
 }else if(f==='newSub'){
  const n=$('#subName').value.trim();if(!n){toast('Adj nevet a területnek.');return;}
  actById(actOpen).subs.push({id:uid(),name:n});save();render();
 }else if(f==='steps'){
  const n=Math.round(num($('#stepsIn').value));if(!isFinite(n)||n<0||n>100000){toast('Érvénytelen lépésszám.');return;}
  const d=day();d.steps=n;d.stepsAt=Date.now();save();render();
 }else if(f==='block'){
  const k=$('#blockIn').value;if(!k){toast('Válassz dátumot.');return;}
  if(!S.blocked.includes(k))S.blocked.push(k);save();render();
 }else if(f==='weight'){
  const w=num($('#wIn').value);if(!(w>=30&&w<=300)){toast('Érvénytelen testsúly.');return;}
  const k=dkey();S.weights=S.weights.filter(x=>x.k!==k);S.weights.push({k,kg:Math.round(w*10)/10});
  const latest=S.weights.slice().sort((a,b)=>a.k<b.k?1:-1)[0];S.profile.weight=latest.kg;
  const msg=adaptBMR();save();render();toast(msg||'Testsúly rögzítve, a célok frissültek.');
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='fn'){e.preventDefault();$('#fk').focus();}});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='bpmRange'){setBpm(+t.value);return;}
 if(t.id==='f_sg'){$('#sgv').textContent=fmt(+t.value);return;}
 if(t.id==='gymIn'&&S.session){S.session.gym=t.value.trim();save();return;}
 if(!t.dataset.in||!S.session)return;
 const id=t.dataset.id,ex=exById(id),en=S.session.entries[id]||(S.session.entries[id]={});
 en[t.dataset.in]=t.value.trim();
 if(t.dataset.in!=='note'){en.done=!!(en.reps&&(ex.bw||en.w));const c=t.closest('.ex').querySelector('.check');if(c)c.classList.toggle('on',en.done);}
 if(!en.eq){const g=t.closest('.ex').querySelector('[data-seg^="eq_"] .on');if(g)en.eq=g.dataset.v;}
 save();
});
document.addEventListener('change',e=>{if(e.target.id==='gymIn'&&S.session)render();});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.file)return;const f=t.files&&t.files[0];if(!f)return;
 if(f.size>300*1048576&&!confirm('Ez a fájl '+Math.round(f.size/1048576)+' MB. A nagy videók gyorsan betöltik a telefon tárhelyét. Így is csatolod?'))return;
 attachBlob(t.dataset.file,f,f.name);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){S=load();render();}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
