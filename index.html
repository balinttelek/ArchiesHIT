/* ---------- state ---------- */
function fresh(){return {profile:null,days:{},workouts:[],rest:{hours:MIN_REST,log:[]},volume:[0,0,0,0,0],nextDay:0,pressFirst:false,session:null,blocked:[],comp:{},compHandled:{},

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){const f=fresh();const o=Object.assign(f,s);o.results=Object.assign(fresh().results,s.results||{});while(o.volume.length<4)o.volume.push(0);return o;}}catch(e){}return fresh();}

function dkey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function kdate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(k,n){const d=kdate(k);d.setDate(d.getDate()+n);return dkey(d);}
function day(k=dkey()){if(!S.days[k])S.days[k]={steps:null,stepsAt:null,food:[],water:[],recovery:null};return S.days[k];}
const fmt=n=>Math.round(n).toLocaleString('hu-HU');
const dec=(n,d=1)=>(+n).toFixed(d).replace('.',',');
const kg=w=>String(Math.round(w*100)/100).replace('.',',');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function num(s){if(s==null||s==='')return NaN;s=String(s).replace(/[\s  ]/g,'');if(/^\d{1,3}([.,]\d{3})+$/.test(s))s=s.replace(/[.,]/g,'');return parseFloat(s.replace(',','.'));}
function hm(ts){return new Date(ts).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});}
function when(ts){return new Date(ts).toLocaleString('hu-HU',{month:'long',day:'numeric',weekday:'long',hour:'2-digit',minute:'2-digit'});}
function dateLong(k){return kdate(k).toLocaleDateString('hu-HU',{month:'long',day:'numeric',weekday:'long'});}
function dateShort(k){return kdate(k).toLocaleDateString('hu-HU',{month:'short',day:'numeric'});}
function dur(ms){const h=Math.ceil(ms/36e5);const d=Math.floor(h/24),r=h%24;return ((d?d+' nap ':'')+(r||!d?r+' óra':'')).trim();}
function meanSd(a,floor=.5){const m=a.reduce((x,y)=>x+y,0)/a.length;const v=a.reduce((x,y)=>x+(y-m)**2,0)/a.length;return {m,s:Math.max(Math.sqrt(v),floor)};}

/* ---------- steps from URL (?steps=1234), sent by the iOS Shortcut ---------- */
(function(){const p=new URLSearchParams(location.search);if(p.has('steps')){const v=Math.round(num(p.get('steps')));if(isFinite(v)&&v>=0){const d=day();d.steps=v;d.stepsAt=Date.now();save();}history.replaceState(null,'',location.pathname);}})();

/* ---------- nutrition ---------- */
function kcalPerStep(P){return P.weight*2.20462*0.000275*(P.height/182.88);}
function targets(P=S.profile){
 const bmr=10*P.weight+6.25*P.height-5*P.age+(P.sex==='m'?5:-161)+(S.bmrAdj||0);
 const base=bmr*1.1,kps=kcalPerStep(P),stepGoal=P.stepGoal||10000;
 const maint10k=base+10000*kps,maintGoal=base+stepGoal*kps;
 let rec;
 if(P.goal==='cut')rec=Math.max(KCAL_FLOOR,maint10k*0.8);
 else if(P.goal==='gain')rec=Math.max(KCAL_FLOOR,maintGoal+GAIN_EXTRA);
 else rec=Math.max(KCAL_FLOOR,maintGoal);
 const kcalT=P.kcalOverride?Math.max(KCAL_FLOOR,P.kcalOverride):rec;
 const waterRec=P.weight*35,waterT=P.waterTarget||waterRec,protT=P.weight*GOALS[P.goal].p;
 const weekly=(maintGoal-kcalT)*7/7700; // + = fogyás, - = hízás (kg/hét)
 let lean=null,bfGoalW=null;
 if(P.bf){lean=P.weight*(1-P.bf/100);bfGoalW=lean/(1-(P.targetBf||(P.sex==='m'?12:22))/100);}
 const goalW=P.goalWeight||bfGoalW;
 let weeks=null;
 if(goalW&&P.goal!=='maintain'){const diff=P.weight-goalW;if(Math.abs(diff)<0.3)weeks=0;else if(diff*weekly>0)weeks=Math.ceil(Math.abs(diff/weekly));}
 return {bmr,base,kps,stepGoal,maintGoal,rec,kcalT,waterRec,waterT,protT,weekly,lean,bfGoalW,goalW,weeks};
}
function calc(k=dkey()){
 const P=S.profile,d=day(k),T=targets(P);
 const steps=d.steps||0,stepK=steps*T.kps,burn=T.base+stepK;
 const stepGoalDay=T.stepGoal;
 const eaten=d.food.reduce((a,f)=>a+(f.kcal||0),0),prot=d.food.reduce((a,f)=>a+(f.protein||0),0),water=d.water.reduce((a,w)=>a+w.ml,0);
 return Object.assign({},T,{steps,stepK,burn,stepGoalDay,eaten,prot,water,G:GOALS[P.goal]});
}

/* ---------- workout schedule ---------- */
const isCal=w=>w.type==='cal';
function isBlocked(k){return S.blocked.includes(k);}
function shiftBlocked(due,keepTime){let g=0;while(isBlocked(dkey(new Date(due)))&&g++<90){const d=new Date(due);due=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,keepTime?d.getHours():8,keepTime?d.getMinutes():0).getTime();}return due;}
function dueBefore(limit){
 const mains=S.workouts.filter(w=>!isCal(w)&&w.at<limit);const last=mains[mains.length-1];if(!last)return null;
 const cals=S.workouts.filter(w=>isCal(w)&&w.at>last.at&&w.at<limit).length;
 return {due:shiftBlocked(last.at+(S.rest.hours+CAL_EXTRA_H*cals)*36e5,true),cals};
}
function dueAt(){const r=dueBefore(Infinity);if(r)return r.due;return isBlocked(dkey())?shiftBlocked(Date.now(),false):null;}
/* Kihagyás csak akkor ront, ha egy hétnél tovább marad el az esedékes edzés (és az adott nap nem bejelentett kihagyás). */
function trains(){return !!(S.profile&&S.profile.trains!==false);}
function missed(k){if(!trains())return false;const start=kdate(k).getTime(),r=dueBefore(start+864e5);if(!r)return false;return !isBlocked(k)&&start-r.due>GRACE_DAYS*864e5;}

/* ---------- adherence ---------- */
function fastCount(k){let n=0;for(let i=0;i<FAST_WINDOW;i++){const d=S.days[addDays(k,-i)];if(d&&d.fast)n++;}return n;}
function fastValid(k){return !!(S.days[k]&&S.days[k].fast)&&fastCount(k)<=FAST_MAX;}
/* Kalóriatartozás egy napra: (bevitt − cél) + (lépéscél − lépés) × kcal/lépés. Negatív = előny. */
function dayDebt(k){const c=calc(k);return (c.eaten-c.kcalT)+(c.stepGoal-c.steps)*c.kps;}
/* Lezárt napok értéke rögzül, hogy a későbbi testsúlyváltozás ne írja át a múltat. */
function closedDebt(k){if(S.debtLog[k]==null)S.debtLog[k]=Math.round(dayDebt(k));return S.debtLog[k];}
function debtState(){
 const today=dkey(),from=S.debtFrom||'0000';
 const carry=trackedDays(from,today).reduce((a,k)=>a+closedDebt(k),0);
 const live=dayDebt(today);return {carry,live,total:carry+live};
}
function lossScore(k){ // Fogyás: csak bevitt és elégetett kalória
 const dd=S.days[k]||{};if(dd.fast&&!fastValid(k))return 0; // 3 böjtnap / 14 nap fölött nem javít
 const d=closedDebt(k);return d<=0?1:Math.max(0,1-d/1000);
}
function score(k,final){
 const c=calc(k),T=c.kcalT,e=c.eaten,dd=S.days[k]||{};let ks;
 if(dd.fast)ks=fastValid(k)?1:0;
 else if(S.profile.goal==='cut')ks=e<=T?1:1-(e-T)/1000;
 else{const d=e-T;ks=Math.abs(d)<=150||(!final&&d<0)?1:1-(Math.abs(d)-150)/850;}
 ks=Math.max(0,Math.min(1,ks));
 const parts={kcal:ks,prot:dd.fast?0:Math.min(1,c.prot/c.protT),steps:Math.min(1,c.steps/c.stepGoalDay),water:Math.min(1,c.water/c.waterT),workout:missed(k)?0:1,creatine:dd.creatine?1:0};
 return {parts};
}
const isTracked=k=>!!(S.days[k]&&(S.days[k].food.length||S.days[k].fast));
function trackedDays(from,to){return Object.keys(S.days).filter(k=>k>=from&&k<to&&isTracked(k)).sort();}
/* Bodybuilding: minden gyakorlatot az előző, azonos eszközös alkalmához mér. Elvárás: +1 ismétlés (időzítettnél +5 mp). */
function e1rm(w,reps){return w>0?w*(1+reps/30):reps;}
function strengthStats(){
 const last={},res={n:0,up:0,same:0,down:0,sum:0};
 S.workouts.forEach(w=>Object.entries(w.entries||{}).forEach(([id,e])=>{
  if(!e.done||!e.reps)return;const ex=exById(id);if(!ex)return;
  const r=range(ex),timed=r.sec||r.hold,add=num(e.w)||0,reps=num(e.reps)||0,bw=ex.bw?S.profile.weight:0;
  const val=timed?reps:e1rm(add+bw,reps),key=id+'|'+(e.eq||''),p=last[key];
  if(p){const exp=p.timed?p.reps+5:e1rm(p.load,p.reps+1);let sc;
   if(val>=exp-1e-6){sc=1;res.up++;}else if(val>=p.val-1e-6){sc=.5;res.same++;}else{sc=0;res.down++;}
   res.n++;res.sum+=sc;}
  last[key]={val,reps,load:add+bw,timed};
 }));
 res.v=res.n?res.sum/res.n:null;return res;
}
function allScores(){
 const ks=trackedDays('0000',dkey());
 const out={n:ks.length,loss:null,general:null,parts:null,strength:strengthStats()};
 if(ks.length){
  out.loss=ks.reduce((a,k)=>a+lossScore(k),0)/ks.length;
  const sum={kcal:0,prot:0,steps:0,water:0,workout:0,creatine:0};
  ks.forEach(k=>{const p=score(k,true).parts;Object.keys(sum).forEach(x=>sum[x]+=p[x]);});
  Object.keys(sum).forEach(x=>sum[x]/=ks.length);
  sum.strength=out.strength.v;out.parts=sum;
  const use=Object.keys(W).filter(x=>sum[x]!=null&&(x!=='creatine'||S.profile.creatine)&&(trains()||(x!=='workout'&&x!=='strength')));
  const wsum=use.reduce((a,x)=>a+W[x],0);
  out.general=use.reduce((a,x)=>a+W[x]*sum[x],0)/wsum;
 }
 return out;
}

/* ---------- adaptive BMR from real weight ---------- */
function slope(pts){const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;let nu=0,de=0;pts.forEach(p=>{nu+=(p.x-mx)*(p.y-my);de+=(p.x-mx)**2;});return de?nu/de:0;}
function adaptBMR(){
 const today=dkey(),from=addDays(today,-28);
 const ws=S.weights.filter(w=>w.k>=from).sort((a,b)=>a.k<b.k?-1:1);if(ws.length<3)return null;
 const span=(kdate(ws[ws.length-1].k)-kdate(ws[0].k))/864e5;if(span<14)return null;
 const last=S.bmrLog[S.bmrLog.length-1];if(last&&Date.now()-last.at<7*864e5)return null;
 const days=[];for(let k=ws[0].k;k<ws[ws.length-1].k;k=addDays(k,1))days.push(k);
 const tracked=days.filter(isTracked);
 if(tracked.length/days.length<0.8)return null;
 const avgK=tracked.reduce((a,k)=>a+score(k,true).parts.kcal,0)/tracked.length;if(avgK<0.8)return null; // csak következetes időszakból tanul
 let expected=0;days.forEach(k=>{const c=calc(k);expected+=((isTracked(k)?c.eaten:c.kcalT)-c.burn)/7700;});
 const actual=slope(ws.map(w=>({x:(kdate(w.k)-kdate(ws[0].k))/864e5,y:w.kg})))*span;
 const diff=(expected-actual)*7700/span; // + = többet égetsz a becsültnél
 if(Math.abs(diff)<75)return null;
 const step=Math.round(diff*0.5);const before=S.bmrAdj||0;
 S.bmrAdj=Math.max(-MAX_BMR_ADJ,Math.min(MAX_BMR_ADJ,before+step));
 if(S.bmrAdj===before)return null;
 S.bmrLog.push({at:Date.now(),delta:S.bmrAdj-before,expected,actual});
 return 'A valós súlyváltozásod ('+dec(actual,1)+' kg) eltér a várttól ('+dec(expected,1)+' kg), ezért a becsült BMR '+(S.bmrAdj>before?'+':'')+(S.bmrAdj-before)+' kcal-lal módosult.';
}

/* ---------- training logic ---------- */
function dayDef(i){return i==='cal'?CAL:DAYS[i];}
function visibleEx(i,swapDL){
 if(i==='cal')return CAL.ex.slice();
 const D=DAYS[i],gone=new Set(D.remove.slice(0,S.volume[i]||0));
 if(i===0&&swapDL){gone.add('row');gone.add('shrug');gone.add('partialdl');}
 let ex=D.ex.filter(e=>!gone.has(e.id));
 if(i===0){const rs=gone.has('row')&&gone.has('shrug');ex=ex.filter(e=>e.id!=='deadlift'||rs);}
 if(i===2&&S.pressFirst){const a=ex.findIndex(e=>e.id==='lateral'),b=ex.findIndex(e=>e.id==='press');if(a>-1&&b>-1){[ex[a],ex[b]]=[ex[b],ex[a]];}}
 return ex;
}
function range(e){if(e.r==='sec')return {sec:true};if(e.r==='hold')return {hold:true};const [lo,hi]=e.r.split('-').map(Number);return {lo,hi};}
function rangeText(e){const r=range(e);return r.sec?'max idő (mp)':r.hold?'statikus tartás (mp)':`${e.r} ism.`;}
function lastEntry(id,gym,eq){
 const m=[];for(let i=S.workouts.length-1;i>=0;i--){const e=S.workouts[i].entries[id];if(e&&e.done&&e.reps)m.push({e,gym:S.workouts[i].gym||''});}
 return (m.find(x=>gym&&x.gym===gym&&x.e.eq===eq)||m.find(x=>x.e.eq===eq)||m[0]||{}).e||null;
}
/* Ajánlás: előző alkalom +1 ismétlés; ha túllépi a tartomány tetejét, súlyemelés kb. 5%-kal és vissza az aljára. */
function recommend(e,gym,eq){
 const r=range(e),l=lastEntry(e.id,gym,eq);
 if(!l)return r.sec||r.hold?'Első alkalom: tarts ki, ameddig bírod.':e.bw?`Első alkalom: ahány ismétlés bukásig megy. Ha ${r.hi} fölött vagy, tegyél rá plusz súlyt.`:`Első alkalom: olyan súly, amivel ${e.r} ismétlés megy bukásig.`;
 const w=num(l.w)||0,reps=num(l.reps)||0;
 if(r.sec||r.hold)return `Cél: ${w?kg(w)+' kg, ':''}${reps+5} mp (múlt: ${reps} mp)`;
 if(reps+1<=r.hi)return `Cél: ${w?kg(w)+' kg × ':''}${reps+1} ismétlés (múlt: ${w?kg(w)+' kg × ':''}${reps})`;
 if(!w||e.bw)return `Cél: ${reps+1} ismétlés, vagy tegyél rá plusz súlyt (múlt: ${reps})`;
 const nw=Math.max(w+1,Math.round(w*1.05/2.5)*2.5);
 return `Cél: ${kg(nw)} kg × ${r.lo} ismétlés, súlyemelés (múlt: ${kg(w)} kg × ${reps})`;
}
function lastWorkout(){return S.workouts[S.workouts.length-1]||null;}
function logRest(text){S.rest.log.push({at:Date.now(),text});if(S.rest.log.length>60)S.rest.log=S.rest.log.slice(-60);}
function reduceAllVolume(){let any=false;S.volume=S.volume.map((v,i)=>{if(i<4&&v<DAYS[i].remove.length){any=true;return v+1;}return v;});return any;}

function applyRecovery(v){
 const k=dkey();
 const prev=Object.keys(S.days).filter(x=>x<k&&S.days[x].recovery!=null).sort().map(x=>S.days[x].recovery);
 day().recovery=v;
 let low=false,high=false;const recent=[...prev.slice(-2),v];
 if(prev.length>=7){
  const {m,s}=meanSd(prev.slice(-28));low=v<m-s;
  const base=prev.slice(0,-2).slice(-28);
  if(base.length>=5&&recent.length===3){const b=meanSd(base);high=recent.every(x=>x>b.m+b.s);}
 }else{low=v<=2;high=recent.length===3&&recent.every(x=>x===5);}
 let msg='Regeneráció rögzítve.';
 if(low){
  if(S.rest.hours<MAX_REST){S.rest.hours=Math.min(MAX_REST,S.rest.hours+24);msg='Gyenge regeneráció: pihenő +24 óra (most '+dur(S.rest.hours*36e5)+').';logRest('Regeneráció '+v+'/5, pihenő +24 óra → '+S.rest.hours+' óra');}
  else if(reduceAllVolume()){msg='A pihenő már a maximumon van, ezért a volumen csökkent minden napon.';logRest('Regeneráció '+v+'/5 maximális pihenő mellett, volumen −1 minden napon');}
  else msg='Pihenő és volumen is a határon. Ha ez tartós, nézz rá az alvásra és az étkezésre.';
 }else if(high&&S.rest.hours>MIN_REST){
  const lastDown=[...S.rest.log].reverse().find(l=>l.down);
  if(!lastDown||Date.now()-lastDown.at>=3*864e5){S.rest.hours=Math.max(MIN_REST,S.rest.hours-12);msg='Tartósan jó regeneráció: pihenő −12 óra (most '+dur(S.rest.hours*36e5)+').';logRest('3 kiemelkedő nap, pihenő −12 óra → '+S.rest.hours+' óra');S.rest.log[S.rest.log.length-1].down=true;}
 }
 save();return msg;
}
function applyWorkoutRating(i,r){
 if(i==='cal')return 'Calisthenics edzés elmentve, a következő edzés 3 nappal később esedékes.';
 const prev=S.workouts.filter(w=>w.scale===10&&!isCal(w)).map(w=>w.rating);
 let low,high;
 if(prev.length>=5){const {m,s}=meanSd(prev.slice(-20),1);low=r<m-s;high=r>m+s;}else{low=r<=4;high=r>=9;}
 const max=DAYS[i].remove.length,v=S.volume[i]||0,nm=id=>DAYS[i].ex.find(e=>e.id===id).n;
 if(low&&v<max){S.volume[i]=v+1;logRest(DAYS[i].name+': alacsony hatékonyság ('+r+'/10), kikerül: '+nm(DAYS[i].remove[v]));return 'Következő alkalommal kimarad: '+nm(DAYS[i].remove[v])+'.';}
 if(high&&v>0){S.volume[i]=v-1;logRest(DAYS[i].name+': magas hatékonyság ('+r+'/10), visszakerül: '+nm(DAYS[i].remove[v-1]));return 'Következő alkalommal visszakerül: '+nm(DAYS[i].remove[v-1])+'.';}
 return 'Edzés elmentve.';
}

function bestLogged(id){
 let b=null;S.workouts.forEach(w=>{const e=w.entries[id];if(!e||!e.done||!e.reps)return;const x={w:num(e.w)||0,reps:num(e.reps)||0,k:dkey(new Date(w.at))};
  if(!b||x.w>b.w||(x.w===b.w&&x.reps>b.reps))b=x;});return b;
}
function bestOf(id){const a=bestLogged(id),m=S.prs[id];if(!a)return m||null;if(!m)return a;return (m.w>a.w||(m.w===a.w&&m.reps>a.reps))?m:a;}
function prText(id){const b=bestOf(id),e=exById(id),r=range(e);if(!b)return 'nincs adat';return (b.w?kg(b.w)+' kg × ':'')+b.reps+(r.sec||r.hold?' mp':' ism.')+' · '+dateShort(b.k);}
const BW={pullups:{n:'Max. húzódzkodás',u:'ism.',ids:['pullup']},deadhang:{n:'Deadhang',u:'mp',ids:['deadhang']},dips:{n:'Max. tolódzkodás',u:'ism.',ids:['dipcal','dipchest','diparm']}};
function bwBest(key){
 let b=null;S.results[key].forEach(x=>{if(!b||x.val>b.val)b=x;});
 S.workouts.forEach(w=>BW[key].ids.forEach(id=>{const e=w.entries[id];if(e&&e.done&&e.reps&&!(num(e.w)>0)){const v=num(e.reps);if(!b||v>b.val)b={val:v,k:dkey(new Date(w.at))};}}));
 return b;
}

/* ---------- csatolmányok: IndexedDB-ben (a localStorage túl kicsi a hanghoz és videóhoz) ---------- */
const MEDIA_URLS={};let dbP=null;
function db(){if(!dbP)dbP=new Promise((res,rej)=>{const r=indexedDB.open('goldenMeanMedia',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return dbP;}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('media',mode),st=tx.objectStore('media'),r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
const putBlob=(id,b)=>idb('readwrite',st=>st.put(b,id)),getBlob=id=>idb('readonly',st=>st.get(id)),delBlob=id=>idb('readwrite',st=>st.delete(id));
async function hydrateMedia(){
 for(const el of document.querySelectorAll('[data-media]')){const id=el.dataset.media;
  if(!MEDIA_URLS[id]){try{const b=await getBlob(id);if(!b){el.replaceWith(Object.assign(document.createElement('div'),{className:'hint',textContent:'A fájl nem található ezen az eszközön.'}));continue;}MEDIA_URLS[id]=URL.createObjectURL(b);}catch(e){continue;}}
  if(el.getAttribute('src')!==MEDIA_URLS[id])el.src=MEDIA_URLS[id];}
}
async function attachBlob(tid,blob,name){
 const a=actById(actOpen),t=a&&a.trophies.find(x=>x.id===tid);if(!t)return;
 const type=(blob.type||'').startsWith('video')?'video':'audio',id=uid();
 try{await putBlob(id,blob);}catch(e){toast('Nem sikerült menteni. Lehet, hogy betelt a tárhely.');return;}
 (t.media=t.media||[]).push({id,type,name,size:blob.size,k:dkey()});save();render();toast('Csatolva.');
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
}
const REC={t:null,rec:null,chunks:[]};
async function recToggle(tid){
 if(REC.rec){REC.rec.stop();return;}
 if(!navigator.mediaDevices||!window.MediaRecorder){toast('Ez az eszköz nem támogatja a hangfelvételt.');return;}
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Nincs engedély a mikrofonhoz.');return;}
 const mime=['audio/mp4','audio/webm','audio/aac'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
 const rec=new MediaRecorder(stream,mime?{mimeType:mime}:{});REC.t=tid;REC.rec=rec;REC.chunks=[];
 rec.ondataavailable=e=>{if(e.data.size)REC.chunks.push(e.data);};
 rec.onstop=()=>{stream.getTracks().forEach(x=>x.stop());const blob=new Blob(REC.chunks,{type:rec.mimeType||mime||'audio/mp4'});const t=REC.t;REC.t=null;REC.rec=null;
  if(blob.size)attachBlob(t,blob,'Hangfelvétel '+new Date().toLocaleString('hu-HU',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}));else render();};
 rec.start();render();
}

function detectPitch(b,sr){
 let rms=0;for(let i=0;i<b.length;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/b.length);if(rms<0.01)return -1;
 let r1=0,r2=b.length-1;const th=0.2;
 for(let i=0;i<b.length/2;i++)if(Math.abs(b[i])<th){r1=i;break;}
 for(let i=1;i<b.length/2;i++)if(Math.abs(b[b.length-i])<th){r2=b.length-i;break;}
 const x=b.slice(r1,r2),n=x.length,c=new Float32Array(n);
 for(let i=0;i<n;i++)for(let j=0;j<n-i;j++)c[i]+=x[j]*x[j+i];
 let d=0;while(d<n-1&&c[d]>c[d+1])d++;
 let mx=-1,mp=-1;for(let i=d;i<n;i++)if(c[i]>mx){mx=c[i];mp=i;}
 if(mp<1||mp>=n-1)return -1;
 const y1=c[mp-1],y2=c[mp],y3=c[mp+1],a=(y1+y3-2*y2)/2,bb=(y3-y1)/2;const T=a?mp-bb/(2*a):mp;
 const f=sr/T;return f>60&&f<1400?f:-1;
}
function tunerLoop(){
 if(!TU.on)return;TU.an.getFloatTimeDomainData(TU.buf);
 const f=detectPitch(TU.buf,TU.ctx.sampleRate),note=$('#tuNote');
 if(note&&f>0){
  TU.hist.push(f);if(TU.hist.length>5)TU.hist.shift();const fs=TU.hist.slice().sort((a,b)=>a-b)[TU.hist.length>>1];
  const a4=S.a4||440,midiF=69+12*Math.log2(fs/a4),midi=Math.round(midiF),cents=Math.round((midiF-midi)*100);
  note.innerHTML=NOTES[(midi%12+12)%12]+'<sub>'+(Math.floor(midi/12)-1)+'</sub>';
  $('#tuInfo').textContent=fs.toFixed(1).replace('.',',')+' Hz';
  $('#tuCents').textContent=(cents>0?'+':'')+cents+' cent'+(Math.abs(cents)<=5?' · tiszta':cents<0?' · húzd feljebb':' · engedd lejjebb');
  $('#tuNeedle').style.left=(50+Math.max(-50,Math.min(50,cents)))+'%';
  let best=0,bd=99;STRINGS.forEach(([_,m],i)=>{const dd=Math.abs(midiF-m);if(dd<bd){bd=dd;best=i;}});
  document.querySelectorAll('#tuStrings span').forEach((e,i)=>{e.classList.toggle('near',i===best&&bd<1&&Math.abs(cents)>5);e.classList.toggle('ok',i===best&&bd<1&&Math.abs(cents)<=5);});
 }
 TU.raf=requestAnimationFrame(tunerLoop);
}
async function tunerStart(){
 if(!navigator.mediaDevices){toast('Ez az eszköz nem támogatja a mikrofont.');return;}
 try{TU.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}catch(e){toast('Nincs engedély a mikrofonhoz.');return;}
 TU.ctx=TU.ctx||new (window.AudioContext||window.webkitAudioContext)();await TU.ctx.resume();
 const src=TU.ctx.createMediaStreamSource(TU.stream);TU.an=TU.ctx.createAnalyser();TU.an.fftSize=4096;src.connect(TU.an);
 TU.buf=new Float32Array(TU.an.fftSize);TU.on=true;TU.hist=[];
 const b=$('#tuBtn');if(b){b.textContent='Stop';b.className='danger ghost grow';}const i=$('#tuInfo');if(i)i.textContent='Pengess meg egy húrt';
 tunerLoop();
}
function tunerStop(){

}

function click(time,acc){
 const o=M.ctx.createOscillator(),g=M.ctx.createGain();o.frequency.value=acc?1500:1000;
 g.gain.setValueAtTime(0.0001,time);g.gain.exponentialRampToValueAtTime(acc?0.9:0.55,time+0.001);g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
 o.connect(g).connect(M.ctx.destination);o.start(time);o.stop(time+0.06);
}
function sched(){
 while(M.next<M.ctx.currentTime+0.12){
  const n=S.metro.beats||1,b=M.beat%n;click(M.next,n>1&&b===0);
  const delay=Math.max(0,(M.next-M.ctx.currentTime)*1000);setTimeout(()=>flash(b),delay);
  M.next+=60/S.metro.bpm;M.beat++;
 }
}
function flash(b){const el=document.querySelectorAll('#beats i');el.forEach((x,i)=>x.classList.toggle('on',i===b));setTimeout(()=>el.forEach(x=>x.classList.remove('on')),90);}
function metroStart(){
 if(!M.ctx)M.ctx=new (window.AudioContext||window.webkitAudioContext)();
 M.ctx.resume();M.on=true;M.beat=0;M.next=M.ctx.currentTime+0.06;sched();M.timer=setInterval(sched,25);
}
function metroStop(){M.on=false;clearInterval(M.timer);M.timer=null;}

/* ---------- munka: napi feladatok, alfeladatokkal; a lezáratlanok átnyúlnak a következő napra ---------- */
let workDay=null,taskOpen=null;
function taskVisible(t,k){return t.date<=k&&(!t.done||t.doneDay>=k);}
function taskDoneOn(t,k){return t.done&&t.doneDay<=k;}
function daysBetween(a,b){return Math.round((kdate(b)-kdate(a))/864e5);}
function setTaskDone(t,v,k){t.done=v;t.doneDay=v?k:null;if(v)t.subs.forEach(x=>x.done=true);}

 const open=list.filter(t=>!taskDoneOn(t,k)).length,done=list.length-open;
 const label=isToday?'Ma':k===addDays(today,1)?'Holnap':k===addDays(today,-1)?'Tegnap':'';
 return `<h1>Munka</h1><div class="sub">Napi feladatok. A le nem zártak átkerülnek a következő napra.</div>

  <button class="sm" data-a="workDay" data-v="1" aria-label="Következő nap">›</button></div>

  ${list.length?`<div style="margin-top:4px">${list.map(t=>taskHtml(t,k)).join('')}</div>`:`<div class="hint">${past?'Ezen a napon nem volt feladat.':'Nincs feladat erre a napra.'}</div>`}

}
function taskHtml(t,k){

   ${carried||t.subs.length?`<div class="small muted">${carried?`<span class="carry">áthozva ${carried} napja</span>${t.subs.length?' · ':''}`:''}${t.subs.length?`${subsDone}/${t.subs.length} alfeladat`:''}</div>`:''}</div>
  <button class="ibtn" data-a="taskSubs" data-v="${t.id}" aria-label="Alfeladatok">${openSubs?'−':'+'}</button>

/* ---------- mentés / visszatöltés ---------- */
function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob);});}
async function backup(){
 toast('Mentés készül…');
 const media={};
 for(const a of S.acts)for(const t of a.trophies||[])for(const m of t.media||[]){try{const b=await getBlob(m.id);if(b)media[m.id]=await b64(b);}catch(e){}}
 const data=JSON.stringify({app:'golden-mean',v:1,at:new Date().toISOString(),state:S,media});
 const name='golden-mean-mentes-'+dkey()+'.json',file=new File([data],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});toast('Mentés kész.');return;}}catch(e){if(e&&e.name==='AbortError')return;}
 const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
 toast('Mentés kész: '+name);
}
async function restore(f){
 let d;try{d=JSON.parse(await f.text());}catch(e){toast('Ez nem érvényes mentésfájl.');return;}
 if(!d||d.app!=='golden-mean'||!d.state||!d.state.profile){toast('Ez nem Golden Mean mentés.');return;}
 if(!confirm('A visszatöltés felülírja a jelenlegi adatokat ezen az eszközön. Folytatod?'))return;
 let n=0;for(const [id,url] of Object.entries(d.media||{})){try{const blob=await (await fetch(url)).blob();await putBlob(id,blob);n++;}catch(e){}}
 S=Object.assign(fresh(),d.state);S.session=null;save();S=load();if(STG.el){STG.el.remove();STG.el=null;document.body.style.overflow='';}OB=null;render();toast('Visszatöltve'+(n?', '+n+' csatolmánnyal':'')+'.');
}

/* ---------- Golden Mean napirend ---------- */
let planView='day',sumDay=null,sumRating=null,jOpen=null;
const tm=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0);};
const tt=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const durTxt=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(h+' ó'+(r?' '+r+' p':'')):r+' p';};
function dayOf(ts){const d=new Date(ts);if(d.getHours()<5)d.setDate(d.getDate()-1);return dkey(d);}
function sleepRec(k){return S.sleep[k]||(S.sleep[k]={});}
function lastNight(k){const b=(S.sleep[addDays(k,-1)]||{}).bed,w=(S.sleep[k]||{}).wake;return b&&w&&w>b&&w-b<20*36e5?{bed:b,wake:w,ms:w-b}:null;}
function isWorkday(k){return (S.plan.workDays||[]).includes(kdate(k).getDay());}
function workoutDueOn(k){const due=dueAt();if(S.workouts.some(w=>!isCal(w)&&dkey(new Date(w.at))===k))return true;return due!=null&&dkey(new Date(due))<=k;}
function genPlan(k){
 const P=S.plan,wk=(S.sleep[k]||{}).wake;
 let bed=tm(P.bed);let wake=bed+P.sleepH*60;
 if(wk&&dkey(new Date(wk))===k){const d=new Date(wk);wake=Math.round((d.getHours()*60+d.getMinutes())/5)*5;}
 wake=((wake%1440)+1440)%1440;if(bed<=wake)bed+=1440;
 const B=[],busy=[];const add=(s,e,t,name)=>{if(e-s<5)return;B.push({id:'g'+t+s,s,e,t,name});busy.push([s,e]);};
 const free=()=>{const iv=[];let cur=wake;busy.slice().sort((a,b)=>a[0]-b[0]).forEach(([s,e])=>{if(s>cur)iv.push([cur,s]);cur=Math.max(cur,e);});if(cur<bed)iv.push([cur,bed]);return iv;};
 const place=(len,from,t,name)=>{for(const [s,e] of free()){const st=Math.max(s,from);if(e-st>=len){add(st,st+len,t,name);return st+len;}}return null;};
 add(wake,wake+45,'routine','Reggeli rutin');
 add(bed-60,bed,'rest','Esti levezetés, képernyő nélkül');
 const work=isWorkday(k);let ws=tm(P.workStart),we=tm(P.workEnd);
 if(work&&we>ws){ws=Math.max(ws,wake+45);we=Math.min(we,bed-60);if(we>ws){add(ws,we,'work','Munka');add(we,we+30,'rest','Átállás, pihenő');}}
 if(!work)place(30,12*60+30,'meal','Ebéd');
 place(30,Math.max(18*60+30,work?we+30:0),'meal','Vacsora');
 if(trains()&&workoutDueOn(k)){const i=S.nextDay;place(75,work?we+30:9*60+30,'workout','Edzés · '+DAYS[i].name);}
 const acts=S.acts.filter(a=>a.goal>0).map(a=>({a,left:a.goal}));let missing=0;
 let from=work&&we>ws?we:wake+45,guard=0;
 while(acts.some(x=>x.left>0)&&guard++<60){
  let progress=false;
  for(const x of acts){if(x.left<=0)continue;const len=Math.min(60,x.left);const end=place(len,from,'act',x.a.name);
   if(end==null){const iv=free().filter(([s,e])=>e-Math.max(s,from)>=20).sort((p,q)=>(q[1]-q[0])-(p[1]-p[0]))[0];
    if(iv){const st=Math.max(iv[0],from),l=Math.min(len,iv[1]-st);if(l<20)continue;add(st,st+l,'act',x.a.name);x.left-=l;progress=true;place(10,st+l,'free','Szünet');}continue;}
   x.left-=len;progress=true;if(x.left>0||acts.some(y=>y!==x&&y.left>0))place(10,end,'free','Szünet');}
  if(!progress)break;
 }
 missing=acts.reduce((a,x)=>a+Math.max(0,x.left),0);
 free().forEach(([s,e])=>{if(e-s>=20)add(s,e,'free','Szabadidő');});
 B.sort((a,b)=>a.s-b.s);
 return {blocks:B.filter(b=>!(b.t==='free'&&b.name==='Szünet'&&b.e-b.s<5)),wake,bed,missing,generated:true};
}
function planFor(k){const p=S.dayPlans[k];return p&&p.edited?p:genPlan(k);}
function freezePlan(k){if(!S.dayPlans[k]||!S.dayPlans[k].edited){const g=genPlan(k);S.dayPlans[k]={blocks:g.blocks,wake:g.wake,bed:g.bed,missing:0,edited:true};}return S.dayPlans[k];}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()+(d.getHours()<5?1440:0);}
function sunBanner(){
 const k=dkey(),h=new Date().getHours(),r=S.sleep[k]||{},bk=dayOf(Date.now()),rb=S.sleep[bk]||{};
 if(false)return `<div class="card sunbar"><div class="grow"><b>Jó reggelt!</b><span class="muted small">Rögzítsd az ébredést, ehhez igazodik a mai napirend.</span></div><button class="primary" data-a="woke">Felébredtem</button></div>`;
 if(!rb.bed&&(h>=20||h<5))return `<div class="card sunbar"><div class="grow"><b>Ideje lefeküdni?</b><span class="muted small">Lefekvéskor lezárod és értékeled a napot.</span></div><button class="primary" data-a="slept">Lefeküdtem</button></div>`;
 return '';
}
function viewPlan(){

 if(planView==='journal')return viewJournal();

 return `<div class="row between"><h1>Napirend</h1><button class="sm" data-a="planJournal">Mentett napok ›</button></div><div class="sub">${dateLong(k)} · ${isWorkday(k)?'munkanap':'szabadnap'}</div>

  <div class="small" style="margin-top:4px">${ln?`Éjjel: ${hm(ln.bed)} → ${hm(ln.wake)} · <b>${durTxt(ln.ms/6e4)}</b>`:r.wake?`Ébredés: ${hm(r.wake)}`:'Ma még nem rögzítettél ébredést.'}</div>
  <div class="row" style="margin-top:10px">${r.wake?'':'<button class="sm" data-a="woke">Felébredtem</button>'}<button class="sm" data-a="slept">Lefeküdtem</button></div></div>

  <div class="row" style="gap:6px">${pl.generated?'':'<button class="sm ghost" data-a="planReset">Ajánlás</button>'}<button class="sm" data-a="blockAdd">+ Blokk</button></div></div>
  ${pl.missing>0?`<div class="hint c-warn" style="margin-bottom:8px">A tevékenységek napi céljaiból ${durTxt(pl.missing)} ma nem fér el. Érdemes a célokat csökkenteni, mint az alvásból elvenni.</div>`:''}
  <div class="tl" style="margin-top:8px">
   <div class="blk b-sleep"><div class="tm">${tt(pl.wake)}</div><div class="grow"><div class="nm">Ébredés</div><div class="du">${durTxt(sleepMin)} alvás után</div></div></div>
   ${pl.blocks.map(b=>`<div class="blk b-${b.t} ${n>=b.s&&n<b.e?'now':n>=b.e?'past':''}" data-a="blockEdit" data-v="${b.id}"><div class="tm">${tt(b.s)}–${tt(b.e)}</div><div class="grow"><div class="nm">${esc(b.name)}</div><div class="du">${durTxt(b.e-b.s)}${n>=b.s&&n<b.e?' · most, még '+durTxt(b.e-n):''}</div></div></div>`).join('')}

function avMsgs(){

 const due=trains()?dueAt():null;if(due&&due<=now&&!S.session)add('wo','Ma edzésnap van: '+DAYS[S.nextDay].name+'. Ugye nem hagyod ki?','tab:workout','Edzés');
 if(h>=16)S.acts.filter(a=>a.goal>0).forEach(a=>{const done=actMs(a.id,null,k)/6e4;if(done<a.goal){const v=verbOf(a.name);
  add('act'+a.id,v?`Ugye nem felejtettél el ma ${v}? Még ${durTxt(a.goal-done)} van hátra.`:`Ugye nem felejtetted el ma: ${a.name}? Még ${durTxt(a.goal-done)} van hátra.`,'act:'+a.id,'Indulok');}});
 if(S.profile.creatine&&!d.creatine&&h>=10)add('cr','Bevetted ma a kreatint?','creatine','Igen, bevettem');
 if(c&&h>=15&&c.water<c.waterT*.5)add('wa',`Ittál ma eleget? Még csak ${dec(c.water/1000)} liternél tartasz.`,'water','+3 dl');
 if(c&&h>=17&&c.steps<c.stepGoal*.6)add('st',`Még ${fmt(c.stepGoal-c.steps)} lépés hiányzik a mai célhoz. Egy séta?`,'tab:today','Mutasd');

 if(c&&h>=19){const t=debtState().total;if(t>300)add('db',`A kalóriatartozásod +${fmt(t)} kcal. Kb. ${fmt(Math.ceil(t/c.kps/100)*100)} lépés lenullázza.`,'tab:today','Mutasd');}
 if(h>=18&&!(d.note||'').trim())add('note','Írj ide valamit, nem kell hogy számítson!','note','Írok');
 if(h>=21&&!S.journal[dayOf(now)])add('jr','Hogy telt a nap? Zárjuk le, és értékeld!','summary','Lezárom');
 return out;
}

function avMount(){
 if(!AV.el){AV.el=document.createElement('div');AV.el.className='avatar';AV.el.innerHTML=avSvg(AV.pose);AV.el.setAttribute('aria-label','Avatár');AV.el.dataset.a='avTap';document.body.appendChild(AV.el);}
 const on=!!(S.profile&&S.avatar.on&&!$('.stage'));AV.el.hidden=!on;document.body.classList.toggle('has-av',on);if(!on)avHide();
}
function avMouth(open,root){root=root||AV.el;if(!root)return;const o=root.querySelector('.m-open'),c=root.querySelector('.m-closed');if(!o)return;o.style.display=open?'':'none';c.style.display=open?'none':'';}
function avPose(p){if(AV.pose===p)return;AV.pose=p;if(AV.el)AV.el.innerHTML=avSvg(p);}
function avSay(m){
 avHide(true);AV.cur=m;const b=document.createElement('div');b.className='avbubble';
 b.innerHTML=`<button class="cl" data-a="avClose" aria-label="Bezárás">×</button><div class="tx" style="padding-right:14px"></div>${m.go?`<div class="acts"><button class="go" data-a="avGo">${esc(m.goLabel)}</button><button data-a="avLater">Később</button></div>`:''}`;
 document.body.appendChild(b);AV.bub=b;AV.el.classList.add('talk');
 const tx=b.querySelector('.tx');let i=0;clearInterval(AV.typing);clearInterval(AV.mouth);let o=false;
 AV.mouth=setInterval(()=>{o=!o;avMouth(o);},110);
 AV.typing=setInterval(()=>{i+=1;tx.textContent=m.text.slice(0,i);if(i>=m.text.length){clearInterval(AV.typing);setTimeout(()=>{clearInterval(AV.mouth);avMouth(false);AV.el.classList.remove('talk');},220);}},28);
 if(m.key){S.avatar.snooze[m.key]=Date.now()+90*6e4;save();}
}
function avHide(keep){clearInterval(AV.typing);clearInterval(AV.mouth);avMouth(false);if(AV.el)AV.el.classList.remove('talk');if(AV.bub){AV.bub.remove();AV.bub=null;}if(!keep)AV.cur=null;}
function avNext(){const ms=avMsgs();if(ms.length){avSay(ms[0]);return;}avSay({text:AV_TIPS[AV.i++%AV_TIPS.length]});}
function avAuto(){if(!S.profile||!S.avatar.on||$('#sheet')||STG.el||AV.bub)return;if(Date.now()-AV.lastAuto<3*6e4)return;const ms=avMsgs();if(!ms.length)return;AV.lastAuto=Date.now();avSay(ms[0]);}
function avGo(){
 const m=AV.cur;avHide();if(!m||!m.go)return;const g=m.go;
 if(g==='note'){tab='today';render();const n=$('#dayNote');if(n){n.scrollIntoView({block:'center'});n.focus();}return;}
 if(g==='creatine'){day().creatine=true;save();render();toast('Kreatin pipálva.');return;}
 if(g==='water'){day().water.push({id:uid(),ml:300});save();render();toast('+3 dl víz.');return;}
 if(g==='summary'){tab='plan';planView='summary';sumDay=dayOf(Date.now());sumRating=null;render();window.scrollTo(0,0);return;}
 if(g.startsWith('act:')){tab='acts';actOpen=g.slice(4);render();window.scrollTo(0,0);return;}
 if(g.startsWith('tab:')){tab=g.slice(4);if(tab==='plan')planView='day';render();window.scrollTo(0,0);}
}

/* ---------- Árcsi jelenetei: teljes képernyős színpad ---------- */
const STG={el:null,t:0,m:0};
function stageOpen(pose,size){
 if(!STG.el){STG.el=document.createElement('div');STG.el.className='stage';document.body.appendChild(STG.el);}
 STG.el.innerHTML=`<div class="in"><div class="sbub" id="sbub"></div><div class="sav ${pose==='couch'?'couch':size||''}">${avSvg(pose)}</div><div class="sbody" id="sbody"></div></div>`;
 STG.el.scrollTop=0;if(AV.el){AV.el.hidden=true;avHide();}document.body.style.overflow='hidden';
}
function stageClose(){if(STG.el){STG.el.remove();STG.el=null;}clearInterval(STG.t);clearInterval(STG.m);document.body.style.overflow='';render();}
function stageSay(text,body,after){
 const b=$('#sbub'),root=STG.el;clearInterval(STG.t);clearInterval(STG.m);if(!b)return;
 const sb=$('#sbody');sb.innerHTML='';sb.style.visibility='hidden';
 let i=0,o=false;STG.m=setInterval(()=>{o=!o;avMouth(o,root);},110);
 const fin=()=>{clearInterval(STG.t);clearInterval(STG.m);avMouth(false,root);b.textContent=text;sb.innerHTML=body||'';sb.style.visibility='';if(after)after();};
 b.onclick=fin;
 STG.t=setInterval(()=>{i+=2;b.textContent=text.slice(0,i);if(i>=text.length)setTimeout(fin,120),clearInterval(STG.t);},26);
}

/* bemutató */
const HOBBIES=['Gitározás','Dobolás','Olvasás','Horgászat','Kertészkedés','Festés','Rajzolás','Főzés','Futás','Nyelvtanulás','Fotózás','Sakk','Zongorázás','Éneklés','Programozás','Írás'];
let OB=null;
function obStart(prefill){
 const P=prefill?Object.assign({},S.profile):{};
 OB={step:0,P,hob:prefill?S.acts.map(a=>a.name):[],hours:Object.fromEntries((prefill?S.acts:[]).map(a=>[a.name,a.weekly||Math.round((a.goal||0)*7/60*2)/2])),plan:Object.assign({},S.plan),re:!!prefill};
 obStep();
}
function obStep(){
 const st=OB.step,P=OB.P,nm=P.name||'';
 if(st===0){stageOpen('cross');stageSay('Szia! Engem Árcsinak hívnak. Én vagyok a kalauzod, aki segít neked megtalálni az aranymetszetet a te tempódban, a te életedre szabva. Készen állsz?',
  `<button class="primary block" data-a="obNext">Készen állok!</button>${OB.re?'<button class="skip" data-a="obCancel">Mégse</button>':`<label class="skip" style="text-align:center;cursor:pointer;padding:8px">Van mentésem: visszatöltés<input type="file" accept=".json,application/json" id="restoreIn" hidden></label>`}`);return;}
 if(st===1){stageOpen('cross','sm');stageSay('A testünk karbantartása elengedhetetlen egy optimális, vitális életstílus kialakításához. Add meg a paramétereidet, hogy segíthessek neked megtalálni a megfelelő edzés/kalória keresztmetszetet.',
  `<div class="card"><div class="grid2" style="margin-top:0">
   <label class="field" style="grid-column:1/-1"><span>Hogy szólíthatlak?</span><input id="ob_name" autocomplete="given-name" value="${esc(nm)}"></label>
   <label class="field"><span>Életkor (év)</span><input id="ob_age" inputmode="numeric" value="${P.age??''}"></label>
   <div class="field"><span>Nem</span>${seg('obsex',[['m','Férfi'],['f','Nő']],P.sex||'m')}</div>
   <label class="field"><span>Testsúly (kg)</span><input id="ob_w" inputmode="decimal" value="${P.weight??''}"></label>
   <label class="field"><span>Magasság (cm)</span><input id="ob_h" inputmode="numeric" value="${P.height??''}"></label>
   <label class="field" style="grid-column:1/-1"><span>Testzsír (%), ha tudod</span><input id="ob_bf" inputmode="decimal" placeholder="nem kötelező" value="${P.bf??''}"></label></div>
   <div class="field"><span>Mi a célod?</span>${seg('obgoal',[['cut','Fogyás'],['maintain','Szinten tartás'],['gain','Tömegnövelés']],P.goal||'maintain')}</div>
   <div class="field"><span>Szedsz kreatint?</span>${seg('obcr',[['1','Igen'],['0','Nem']],P.creatine?'1':'0')}</div>
   <div class="field" style="margin:0"><span>Edzel?</span>${seg('obtr',[['1','Edzek'],['0','Nem edzek']],P.trains===false?'0':'1')}</div></div>
   <button class="primary block" data-a="obNext">Tovább</button>`);return;}
 if(st===2){stageOpen('cross','sm');const T=targets(P);
  stageSay('Köszönöm az együttműködésedet! Hadd mutassam meg a tervezetemet az adataid alapján.',
  `<div class="card"><div class="label">Kalória · ${GOALS[P.goal].n}</div><div class="mid">${fmt(T.kcalT)} kcal / nap</div>
   ${T.weeks?`<div class="hint">A céltestsúlyig (${dec(T.goalW)} kg) kb. ${T.weeks} hét.</div>`:''}
   <div class="grid2"><div class="stat"><span>Fehérje</span><b>${fmt(T.protT)} g</b></div><div class="stat"><span>Víz</span><b>${dec(T.waterRec/1000)} l</b></div></div></div>
  <div class="card"><div class="label">Lépésszám</div><div class="mid"><span id="sgv">${fmt(P.stepGoal||10000)}</span> lépés / nap</div>
   <input type="range" id="ob_sg" min="10000" max="16000" step="500" value="${P.stepGoal||10000}"><div class="hint">Minél többet sétálsz, annál gyorsabban haladsz.</div></div>
  <div class="card"><div class="label">Edzésterv</div>${P.trains===false?'<div class="small">Most nem edzel, ezért a mozgást a napi lépéscél adja. Ha később kedvet kapsz, a Profilomban bekapcsolhatod az edzést.</div>'
   :`<div class="small"><b>Archie's HIT</b>, 4 napos rutin. Minden gyakorlat egy sorozat, bukásig. Két edzés között legalább 48 óra pihenő, ami a regenerációdhoz igazodik.</div>
   <ul class="list small" style="margin-top:6px">${DAYS.map((D,i)=>`<li><div class="grow">${i+1}. nap</div><div>${D.name}</div></li>`).join('')}</ul>`}</div>
  <button class="primary block" data-a="obNext">Tovább</button>`);return;}
 if(st===3){stageOpen('cross','sm');
  stageSay('Bár az edzés fontos, nem élhetünk teljes életet hobbik, mesterségek nélkül. Ezen tevékenységekbe fektetett időnk nyomon követése és a mérföldkövek használata pedig segít a szokásaink megértésében és a fejlődésben.\n\nMik a te hobbijaid, milyen mesterségeket tanulsz?',obHobBody());return;}
 if(st===4){if(!OB.hob.length){OB.step=5;return obStep();}stageOpen('cross','sm');
  stageSay('Egy héten mennyi időt szánsz ezekre a hobbikra?',`<div class="card">${OB.hob.map((h,i)=>`<div class="hrow"><b>${esc(h)}</b><input inputmode="decimal" data-hob="${i}" value="${String(OB.hours[h]??3).replace('.',',')}"><span class="muted small">óra/hét</span></div>`).join('')}
   <div class="hint">Ebből osztom be a napirendedet, egyenletesen a hét napjaira.</div></div><button class="primary block" data-a="obNext">Tovább</button>`);return;}
 if(st===5){stageOpen('cross','sm');const pl=OB.plan;
  stageSay(`Bár sokszor megszabadulnánk tőle, a munka megkerülhetetlen területe életünknek, ami folyamatosan körbevesz minket. Ahogyan Voltaire megfogalmazta: „A munka megóv minket a három fő rossztól: a szegénységtől, az unalomtól és a bűntől.” A feladataink átláthatóságának növelése az egyik leghasznosabb dolog, amit tehetünk az aranymetszetünkért.\n\nMettől meddig dolgozol, kedves ${nm||'barátom'}?`,
  `<div class="card"><div class="grid2" style="margin-top:0">
   <label class="field"><span>Kezdés</span><input type="time" id="ob_ws" value="${pl.workStart}"></label>
   <label class="field"><span>Vége</span><input type="time" id="ob_we" value="${pl.workEnd}"></label></div>
   <div class="field"><span>Munkanapok</span><div class="days7">${[[1,'H'],[2,'K'],[3,'Sze'],[4,'Cs'],[5,'P'],[6,'Szo'],[0,'V']].map(([d,l])=>`<button type="button" data-a="wdToggle" data-v="${d}" class="${pl.workDays.includes(d)?'on':''}">${l}</button>`).join('')}</div></div>
   <div class="grid2"><label class="field" style="margin:0"><span>Mikor fekszel le?</span><input type="time" id="ob_bed" value="${pl.bed}"></label>
   <label class="field" style="margin:0"><span>Alvás (óra)</span><input id="ob_sl" inputmode="decimal" value="${String(pl.sleepH).replace('.',',')}"></label></div></div>
  <button class="primary block" data-a="obNext">Tovább</button>`);return;}
 if(st===6){stageOpen('cross');stageSay('Ezt már szeretem! Kezdődhet az utazás a mindennapok tengerén. Utadon járj szorgalommal és alázattal, hogy megtaláld a kiegyensúlyozott élet aranyát. Kezdhetjük?',
  `<button class="primary block" data-a="obFinish">Kezdjük!</button>`);return;}
}
function obHobBody(){
 const all=[...new Set([...HOBBIES,...OB.hob])];
 return `<div class="card"><div class="chips">${all.map(h=>`<button type="button" data-a="obHob" data-v="${esc(h)}" class="${OB.hob.includes(h)?'on':''}">${esc(h)}</button>`).join('')}</div>
  <form class="inline" data-form="obHobAdd"><input id="ob_hobIn" placeholder="Saját hobbi vagy mesterség" autocomplete="off"><button class="sm" type="submit">Hozzáadás</button></form></div>
  <button class="primary block" data-a="obNext">${OB.hob.length?'Tovább':'Most kihagyom'}</button>`;
}
function obNext(){
 const st=OB.step,P=OB.P;
 if(st===1){
  const n=($('#ob_name').value||'').trim(),age=num($('#ob_age').value),w=num($('#ob_w').value),h=num($('#ob_h').value),bf=num($('#ob_bf').value);
  if(!n){toast('Hogy szólíthatlak? Írd be a neved.');return;}
  if(!(age>=13&&age<=100)||!(w>=30&&w<=300)||!(h>=120&&h<=230)){toast('Ellenőrizd az életkort, a testsúlyt és a magasságot.');return;}
  if(bf&&!(bf>=3&&bf<=60)){toast('A testzsír 3 és 60% között lehet.');return;}
  Object.assign(P,{name:n,age,weight:w,height:h,bf:bf||null,sex:$('#f_obsex').value,goal:$('#f_obgoal').value,creatine:$('#f_obcr').value==='1',trains:$('#f_obtr').value!=='0'});
  if(!P.stepGoal)P.stepGoal=P.goal==='cut'?12000:10000;
 }
 if(st===2)P.stepGoal=+$('#ob_sg').value||10000;
 if(st===4){for(const el of document.querySelectorAll('[data-hob]')){const v=num(el.value);if(!(v>=0&&v<=80)){toast('Az órák száma 0 és 80 között lehet.');return;}OB.hours[OB.hob[+el.dataset.hob]]=v;}}
 if(st===5){const ws=$('#ob_ws').value,we=$('#ob_we').value,bed=$('#ob_bed').value,sl=num($('#ob_sl').value);
  if(!ws||!we||!bed){toast('Adj meg minden időpontot.');return;}if(!(sl>=4&&sl<=12)){toast('Az alvás 4 és 12 óra között lehet.');return;}
  OB.plan={bed,sleepH:sl,workStart:ws,workEnd:we,workDays:[...document.querySelectorAll('.days7 button.on')].map(x=>+x.dataset.v)};}
 OB.step++;obStep();
}
function obFinish(){
 const P=OB.P;S.profile=Object.assign({},S.profile||{},P);S.plan=OB.plan;
 OB.hob.forEach(name=>{const wk=OB.hours[name]??3,goal=Math.round(wk*60/7/5)*5;let a=S.acts.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(a){a.weekly=wk;a.goal=goal;}else S.acts.push({id:uid(),name,goal,weekly:wk,subs:[],metro:/gitár|dob|zongor|ének|bass|hegedű/i.test(name),tuner:/gitár/i.test(name),trophies:[]});});
 S.onboarded=true;OB=null;save();tab='today';
 if(!(S.sleep[dkey()]||{}).wake)S.sleep[dkey()]=Object.assign(S.sleep[dkey()]||{},{wake:Date.now()});save();
 stageClose();window.scrollTo(0,0);
}

/* napi jelenetek */
function wakeScene(){
 stageOpen('cross');stageSay('Felébredtél?',`<div class="row"><button class="primary grow" data-a="wakeYes">Igen</button><button class="grow" data-a="wakeNo">Még nem</button></div>`);
}
const COUCH_REPLY={Pihenek:'Jól teszed. A pihenés is része az aranymetszetnek.',Telefonozok:'Hmm. Tíz perc, aztán leteszed. Megegyeztünk?',Eszek:'Jó étvágyat! Aztán ne felejtsd el beírni a naplóba.'};
function couchScene(){
 S.avatar.couchAt=Date.now();save();stageOpen('couch');
 stageSay('Mi járatban?',`<div class="chips" style="justify-content:center">${Object.keys(COUCH_REPLY).map(o=>`<button data-a="couchAns" data-v="${o}">${o}</button>`).join('')}</div>
  <form class="inline" data-form="couch"><input id="couchIn" placeholder="pl. A barátnőmmel vagyok" autocomplete="off" enterkeyhint="send"><button class="sm primary" type="submit">Küldés</button></form>
  <button class="skip" data-a="stageClose">Később</button>`);
}
function couchAnswer(text){
 const k=dkey(),d=day();(d.evening=d.evening||[]).push({at:Date.now(),text});save();
 const r=COUCH_REPLY[text]||(/barát|család|anyu|apu|szerelm|párom|feleség|férj/i.test(text)?'Ez a legfontosabb. Élvezd, a telefon várhat.':'Értem. Érezd jól magad, itt leszek, ha kellek.');
 stageSay(r,`<button class="primary block" data-a="stageClose">Rendben</button>`);
}
function dailyScene(){
 if(!S.profile||STG.el||$('#sheet'))return false;
 const k=dkey(),h=new Date().getHours(),now=new Date(),nowM=now.getHours()*60+now.getMinutes();
 if(!(S.sleep[k]||{}).wake&&h>=4&&h<20){wakeScene();return true;}
 const P=S.plan;if(isWorkday(k)){const we=tm(P.workEnd),bed=tm(P.bed)+(tm(P.bed)<tm(P.workEnd)?1440:0);
  if(nowM>=we&&nowM<bed-30&&h<23&&(!S.avatar.couchAt||Date.now()-S.avatar.couchAt>2*36e5)){couchScene();return true;}}
 return false;
}
function autoJournal(){
 const today=dkey();let n=0;
 for(let i=1;i<=14;i++){const k=addDays(today,-i);if(S.journal[k])continue;const d=S.days[k]||{};
  const has=isTracked(k)||(d.note||'').trim()||(d.evening||[]).length||S.actLog.some(l=>dkey(new Date(l.start))===k)||S.tasks.some(t=>t.doneDay===k)||(S.sleep[k]||{}).wake||S.workouts.some(w=>dkey(new Date(w.at))===k);
  if(has){S.journal[k]={rating:null,note:(d.note||'').trim(),auto:true,savedAt:Date.now(),snap:daySummary(k)};n++;}}
 if(n)save();
}

function render(){
 avMount();
 const app=$('#app'),nav=$('#nav');
 if(!S.profile){app.innerHTML='';nav.hidden=true;if(!$('.stage'))obStart();return;}
 nav.hidden=false;
 if(!trains()&&(tab==='workout'||tab==='results'))tab='today';
 nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.v===(tab==='results'?'workout':tab==='settings'?'today':tab));if(b.dataset.v==='workout')b.hidden=!trains();});
 app.innerHTML=runBar()+(tab==='workout'?viewWorkout():tab==='plan'?viewPlan():tab==='work'?viewWork():tab==='acts'?viewActs():tab==='results'?viewResults():tab==='settings'?viewSettings():viewToday());
 if(tab==='acts')hydrateMedia();
 maybeAskRecovery();
}

/* ---------- sheets & toast ---------- */
function sheet(title,sub,cb,cancel,scale=5){
 closeSheet();pendingRate=cb;const tt=$('#toast');if(tt)tt.hidden=true;
 const bg=document.createElement('div');bg.className='sheet-bg';bg.id='sheet';
 const btns=scale===5?LABELS.map((l,i)=>`<button data-a="rate" data-v="${i+1}">${i+1}<small>${l}</small></button>`).join('')
  :Array.from({length:10},(_,i)=>`<button data-a="rate" data-v="${i+1}">${i+1}</button>`).join('');
 bg.innerHTML=`<div class="sheet"><h2>${title}</h2><div class="muted small">${sub}</div><div class="rate">${btns}</div>
 ${cancel?`<button class="ghost block" data-a="closeSheet">${cancel}</button>`:''}</div>`;
 document.body.appendChild(bg);
}
function closeSheet(){const s=$('#sheet');if(s)s.remove();pendingRate=null;}
let toastT;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4500);}
function maybeAskRecovery(force){
 if(!S.profile||!trains()||$('#sheet')||$('.stage')||day().recovery!=null)return;
 if(!force&&recoveryDismissed===dkey())return;
 sheet('Mennyire érzed magad regeneráltnak?','Napi első bejelentkezés. Ez alapján igazodik a pihenőidő.',v=>{toast(applyRecovery(v));render();},'Később');
}
function startSession(type){
 S.session={day:type==='cal'?'cal':S.nextDay,type,startedAt:Date.now(),entries:{},swapDL:false,gym:(lastWorkout()||{}).gym||''};
 save();tab='workout';render();window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,v=b.dataset.v,d=day();
 switch(a){
  case 'tab':tab=v;if(v==='plan')planView='day';if(v!=='acts'){if(M.on)metroStop();tunerStop();}render();window.scrollTo(0,0);break;
  case 'obNext':obNext();break;
  case 'obFinish':obFinish();break;
  case 'obCancel':OB=null;stageClose();break;
  case 'obRestart':obStart(true);break;
  case 'obHob':{const i=OB.hob.indexOf(v);if(i>-1)OB.hob.splice(i,1);else OB.hob.push(v);$('#sbody').innerHTML=obHobBody();break;}
  case 'wakeYes':{sleepRec(dkey()).wake=Date.now();save();const ln=lastNight(dkey());
   stageSay('Csodálatos! A telefont vágd ki az ablakon, igyál egy kávét, utána konzultálunk. Csak semmi sietség. Kivéve persze, ha szeretnél visszafejlődni, akkor azonnal nyisd meg az Instagramot.'+(ln?`\n\n(${durTxt(ln.ms/6e4)} alvás.)`:''),`<button class="primary block" data-a="stageClose">Rendben</button>`);break;}
  case 'wakeNo':stageClose();break;
  case 'stageClose':stageClose();break;
  case 'couchAns':couchAnswer(v);break;
  case 'avTap':if(AV.bub){avHide();}else avNext();break;
  case 'avClose':avHide();break;
  case 'avLater':{const m=AV.cur;if(m&&m.key){S.avatar.snooze[m.key]=Date.now()+3*36e5;save();}avHide();break;}
  case 'avGo':avGo();break;

 const id=t.dataset.id,ex=exById(id),en=S.session.entries[id]||(S.session.entries[id]={});
 en[t.dataset.in]=t.value.trim();
 if(t.dataset.in!=='note'){en.done=!!(en.reps&&(ex.bw||en.w));const c=t.closest('.ex').querySelector('.check');if(c)c.classList.toggle('on',en.done);}
 if(!en.eq){const g=t.closest('.ex').querySelector('[data-seg^="eq_"] .on');if(g)en.eq=g.dataset.v;}
 save();
});
document.addEventListener('change',e=>{if(e.target.id==='gymIn'&&S.session)render();});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='restoreIn'&&t.files&&t.files[0]){restore(t.files[0]);t.value='';return;}if(!t.dataset||!t.dataset.file)return;const f=t.files&&t.files[0];if(!f)return;
 if(f.size>300*1048576&&!confirm('Ez a fájl '+Math.round(f.size/1048576)+' MB. A nagy videók gyorsan betöltik a telefon tárhelyét. Így is csatolod?'))return;
 attachBlob(t.dataset.file,f,f.name);});
document.addEventListener('visibilitychange',()=>{if(document.hidden){tunerStop();save();return;}if(STG.el)return;S=load();autoJournal();closeSheet();dailyScene();render();setTimeout(avAuto,900);});
document.addEventListener('focusin',e=>{if(e.target.id==='dayNote'&&S.avatar.on){avPose('write');avSay({text:'Hallgatlak. Írj nyugodtan, nem nézek oda.'});setTimeout(()=>{if(AV.cur&&!AV.cur.key)avHide();},3200);}});
document.addEventListener('focusout',e=>{if(e.target.id==='dayNote'){save();setTimeout(()=>{if(document.activeElement&&document.activeElement.id==='dayNote')return;if(AV.cur&&!AV.cur.key)avHide();avPose('cross');},150);}});
if(S.profile){autoJournal();dailyScene();}
render();
setTimeout(avAuto,1500);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
